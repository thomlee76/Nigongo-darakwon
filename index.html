<style>
:root{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --card:#1C1C1E; --elev:#3A3A3C;
  --ink:#FFFFFF; --ink-2:#8E8E93; --ink-3:#636366;
  --line:#2C2C2E; --line-2:#3A3A3C;
  --good:#30D158; --good-soft:#0F2A18; --bad:#FF453A; --bad-soft:#2E1413;
  --shadow:none; --shadow-lg:none; --edge:transparent; --hard:none;
  --pop:"Mochiy Pop One","Zen Kaku Gothic New",sans-serif;
  --head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","IBM Plex Sans KR",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --ko:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","IBM Plex Sans KR",sans-serif;
  --c1:#FF9F0A; --c1b:#FFB340; --c1s:#2E2110;
  --c2:#FF375F; --c2b:#FF6482; --c2s:#2E1118;
  --c3:#BF5AF2; --c3b:#D285F7; --c3s:#26152E;
  --c4:#64D2FF; --c4b:#8EDFFF; --c4s:#0F2630;
  --c5:#FF6961; --c5b:#FF8A84; --c5s:#2E1614;
  --c6:#30D158; --c6b:#5EDB7A; --c6s:#0F2A18;
  --lime:#A4F000; --brand:linear-gradient(115deg,var(--c3),var(--c4));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;padding:0}
h1,h2,h3,h4{font-weight:700}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px;border-radius:8px}
#wrap{max-width:520px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
ruby{ruby-position:over}
rt{font-family:var(--jp);font-size:.45em;font-weight:400;line-height:1.1;color:inherit;opacity:.72}
.jp{font-family:var(--jp)}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none}
.press{transition:transform .14s ease}
.press:active{transform:scale(.97)}

.hsec{display:flex;align-items:baseline;gap:8px;font-family:var(--head);font-weight:700;font-size:21px;margin:8px 2px 12px;color:#fff}
.hsec small{font-family:var(--ko);font-size:11.5px;color:var(--ink-3)}
.offline{font-size:11px;color:var(--ink-3);text-align:center;margin:18px 0 4px}

/* ── 상단 바 ── */
.topnav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;margin:0 -16px;
  padding:max(8px,env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.backb{width:36px;height:36px;border-radius:50%;background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-2);flex:none}
.crumb{font-family:var(--head);font-weight:700;font-size:17px;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--head);font-weight:700;font-size:12px;color:#000;padding:6px 10px;border-radius:99px;flex:none;background:var(--lime)!important}

/* ── 유닛 ── */
.hero{position:relative;border-radius:22px;overflow:hidden;margin:4px 0 14px}
.hero img{width:100%;height:auto;aspect-ratio:16/7;object-fit:cover;object-position:center 22%;display:block}
.hero .ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,rgba(0,0,0,.8))}
.hero .tt{position:absolute;left:16px;right:16px;bottom:12px;color:#fff}
.hero .tt .j{font-family:var(--head);font-weight:700;font-size:clamp(19px,5.6vw,25px);line-height:1.4;text-shadow:0 2px 12px rgba(0,0,0,.5);text-wrap:balance}
.hero .tt .k{font-size:12.5px;opacity:.93;margin-top:2px}

.tabs{position:sticky;top:calc(max(8px,env(safe-area-inset-top)) + 48px);z-index:15;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;
  padding:4px;border-radius:16px;background:var(--surface);margin-bottom:18px;box-shadow:0 -14px 0 0 var(--bg),0 6px 0 0 var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;border-radius:14px;color:var(--ink-2);position:relative;text-align:center}
.tab .tk{font-family:var(--pop);font-size:15px;line-height:1.2}
.tab.on .tk{color:#000}
.tab .tl{font-size:11px;font-weight:600}
.tab.on{color:#000;background:var(--lime)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 22px);width:15px;height:15px;border-radius:50%;background:var(--good);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:9px;box-shadow:0 0 0 2px var(--surface)}
.tab.on .dot{box-shadow:0 0 0 2px transparent}
.goals{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.goalh{font-family:var(--head);font-size:15px;color:var(--ink-2);margin:0 2px 8px}
.goalc{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--surface)!important;color:var(--ink-2)!important}

.donebar{margin-top:18px}
.donebtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--head);font-size:16px;
  color:#000;padding:14px;border-radius:16px;background:var(--lime)!important;font-weight:700}
.donebtn.was{background:var(--surface)!important;color:var(--ink-2)}

/* 회화 */
.dpills{display:flex;gap:7px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 6px;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dpill{flex:none;display:flex;align-items:center;gap:7px;font-family:var(--head);font-size:14px;padding:7px 13px 7px 8px;border-radius:99px;
  background:var(--surface);color:var(--ink-2)}
.dpill b{font-family:var(--head);font-weight:700;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--ink-2)}
.dpill.on b{background:rgba(255,255,255,.25);color:#fff}
.dpill .ok{color:var(--good);display:flex}
.dpill.on .ok{color:#fff}
.scene{border-radius:20px;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:12px}
.scene img{width:100%;height:auto;display:block;aspect-ratio:3/2;object-fit:cover}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:12px;background:var(--surface);margin-bottom:10px}
.seg button{text-align:center;font-family:var(--head);font-size:14px;padding:8px 4px;border-radius:11px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--elev);color:#fff}
.ctools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:99px;
  background:var(--surface);color:var(--ink-2)}
.tbtn.main{color:#000;background:var(--lime)!important}

/* ── 학습 지도 ── */
.map{position:relative;padding:14px 0 8px;margin-bottom:18px}
.map::before{content:"";position:absolute;left:50%;top:0;bottom:40px;border-left:3px dotted var(--line-2);transform:translateX(-1px)}
.node{position:relative;width:176px;margin:0 auto 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:transform .15s}
.node:active{transform:translateX(var(--sx,0)) scale(.97)}
.node.l{--sx:-62px;transform:translateX(-62px)} .node.r{--sx:62px;transform:translateX(62px)}
.node .ring{position:relative;width:106px;height:106px;border-radius:50%;padding:7px;background:conic-gradient(var(--c) calc(var(--p)*1%),color-mix(in srgb,var(--c) 22%,#000) 0)}
.node .img{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface);border:3px solid #000}
.node .img img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.node .num{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:3px solid #000;
  display:flex;align-items:center;justify-content:center;font-family:var(--pop);font-size:12px;color:var(--c)}
.node.cur .ring{box-shadow:0 0 0 4px #000,0 0 0 6px var(--c)}
.node.cur .ring::after{content:"지금";position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-family:var(--head);font-size:12px;
  background:var(--lime);color:#000;padding:2px 9px;border-radius:99px;font-weight:700}
.node.lock{opacity:.4;filter:grayscale(.9)}
.node .lk{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:22px}
.node .lbl{font-family:var(--head);font-weight:700;font-size:14.5px;line-height:1.25;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .lbl small{display:block;font-family:var(--head);font-weight:700;font-size:10.5px;color:var(--c);letter-spacing:.06em}
.node .steps{display:flex;gap:4px}
.node .steps i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.node .steps i.on{background:var(--c)}
.mapend{text-align:center;font-size:12px;color:var(--ink-3);padding:6px 0 0;display:flex;align-items:center;justify-content:center;gap:5px}

/* ── 만화 페이지 ── */
.comic{position:relative;border-radius:22px;background:var(--surface);overflow:hidden;margin:0 0 12px}
.comic .panel{position:relative}
.comic .panel img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 30%}
.comic .panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 60%,var(--surface))}
.ptag{position:absolute;left:12px;top:12px;z-index:2;font-family:var(--head);font-weight:700;font-size:11.5px;color:#000;padding:5px 10px;border-radius:99px;background:var(--lime)!important}
.chat{display:flex;flex-direction:column;gap:17px;padding:16px 12px 18px;min-height:140px;cursor:pointer}
.bub{position:relative;max-width:86%;background:var(--surface-2);border-radius:20px;padding:12px 14px 11px;display:flex;flex-direction:column}
.bub.L{align-self:flex-start;border-bottom-left-radius:6px} .bub.R{align-self:flex-end;border-bottom-right-radius:6px;background:var(--elev)}
.bub.pop{animation:popIn .32s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
.bub .who{position:static;display:block;font-family:var(--head);font-weight:700;font-size:11px;color:var(--who);background:none!important;padding:0;margin-bottom:2px;white-space:nowrap}
.bub.R .who{text-align:right;color:var(--ink-2)}
.bub .say{display:block;width:100%;padding-right:22px;position:relative;cursor:pointer}
.bub .j{display:block;font-family:var(--jp);font-size:16.5px;line-height:1.85;font-weight:700;color:#fff}
.bub .k{display:block;font-size:11.5px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.chat.noko .bub .k:not(.big){display:none}
.bub .spk{position:absolute;right:-4px;top:4px;color:var(--ink-3);font-size:14px;font-style:normal}
.bub.speaking{box-shadow:0 0 0 2px var(--hl)}
.bub.speaking .spk{color:var(--hl);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bub.hid{background:transparent;border:2px dashed var(--line-2)}
.bub .k.big{font-size:14px;color:#fff;margin:0}
.bub .hintk{font-size:11px;color:var(--ink-3);margin-top:4px}
.ctools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctools .hint{flex:1;min-width:120px;font-size:12px;color:var(--ink-3)}
.rolepick{border-radius:16px;background:var(--surface);padding:16px;text-align:center;cursor:default}
.rolepick p{margin:0 0 4px;font-family:var(--head);font-weight:700;font-size:17px}
.rolepick small{display:block;font-size:12px;color:var(--ink-2);margin-bottom:12px;line-height:1.5}
.rolepick .rr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolepick .rr button{border-radius:14px;background:var(--surface-2);padding:13px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.rolepick .rr .avatar{margin:0}
.rolepick .rr span{font-family:var(--jp);font-size:14px;font-weight:700}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--pop);font-size:13px;color:#fff}
.stepbtn{width:100%;margin-top:4px;font-family:var(--head);font-weight:700;font-size:16px;padding:14px;border-radius:16px;background:var(--surface);text-align:center;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px}
.stepbtn.main{color:#000;background:var(--lime)!important}
.stepbtn:active{opacity:.8}

/* 문법 */
.gcard{border-radius:20px;overflow:hidden;background:var(--card);margin-bottom:14px}
.gp{padding:18px 18px 15px;color:#fff;position:relative;overflow:hidden;background:var(--surface-2)!important}
.gp::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.14);top:-70px;right:-40px}
.gp .gn{font-family:var(--head);font-weight:700;font-size:11px;color:var(--hl);letter-spacing:.08em;position:relative}
.gp .pat{font-family:var(--head);font-weight:700;font-size:clamp(19px,5.6vw,23px);line-height:1.55;position:relative;text-wrap:balance}
.gp .sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;position:relative;font-weight:600}
.gbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.gdesc{font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.gdesc b{color:var(--ink)}
.gexs{display:flex;flex-direction:column;gap:8px}
.gex{position:relative;display:block;width:100%;border-left:3px solid var(--line);padding:4px 34px 4px 12px;border-radius:0 12px 12px 0;background:var(--surface-2)}
.gex:active{background:var(--surface-2)}
.gex .j{display:block;font-family:var(--jp);font-size:16.5px;line-height:1.95}
.gex .k{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}
.gex .spk{position:absolute;right:6px;top:10px;color:var(--ink-3);font-style:normal}
.trap{border-radius:14px;padding:11px 13px 12px;background:var(--bad-soft);color:var(--bad);font-size:12.5px;line-height:1.7}
.trap b.tag{display:inline-block;font-family:var(--head);font-weight:700;font-size:12px;background:var(--bad);color:#fff;
  padding:3px 10px;border-radius:99px;margin-bottom:6px;transform:rotate(-2deg)}
.trap b{font-weight:700}
.board{border-radius:20px;background:var(--card);padding:15px 15px 13px;margin-bottom:14px}
.board h4{margin:0;font-family:var(--head);font-size:16.5px;font-weight:700}
.board p{margin:2px 0 11px;font-size:11.5px;color:var(--ink-3)}
.bwrap{overflow-x:auto}
table.bd{border-collapse:separate;border-spacing:4px;width:100%;min-width:100%}
table.bd.wide{min-width:430px}
.bd th{font-size:11px;font-weight:700;color:var(--ink-3);padding:6px 9px;text-align:left;white-space:nowrap}
.bd td{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;vertical-align:top}
.bd td .jp{font-size:14.5px}
.bd td.hot{background:var(--bad-soft);color:var(--bad)}
.bd td.hot .jp,.bd td.hot b{color:var(--bad)}
.subh{font-family:var(--head);font-weight:700;font-size:17px;margin:22px 2px 10px;display:flex;align-items:baseline;gap:8px}
.subh small{font-family:var(--ko);font-size:11.5px;color:var(--ink-3)}

/* 단어 */
.wtools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.wtools button{display:inline-flex;align-items:center;gap:5px;font-family:var(--head);font-weight:600;font-size:13.5px;padding:8px 14px;border-radius:99px;
  background:var(--surface);color:var(--ink-2)}
.wtools button[aria-pressed="true"],.wtools button.main{color:#000;background:var(--lime)!important}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wchip{position:relative;border-radius:16px;background:var(--card);padding:11px 12px;
  display:flex;flex-direction:column;gap:2px;min-height:56px;justify-content:center;width:100%;transition:transform .12s}
.wchip:active{transform:scale(.97)}
.wchip .j{font-family:var(--jp);font-size:15.5px;line-height:1.45}
.wchip .k{font-size:11.5px;color:var(--ink-2);transition:filter .2s,opacity .2s}
.wchip.hide .k{filter:blur(5px);opacity:.55}
.wchip.hide.peek .k{filter:none;opacity:1}
.wchip .lv{position:absolute;top:7px;right:8px;display:flex;gap:2px}
.wchip .lv i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.wchip .lv i.on{background:var(--good)}
.wchip.x::after{content:"대화";position:absolute;bottom:7px;right:9px;font-size:9.5px;font-weight:700;color:var(--ink-3)}
.wsub{font-family:var(--head);font-weight:700;font-size:14.5px;color:var(--ink-2);margin:16px 2px 9px}
.wsub:first-of-type{margin-top:4px}
.vfilter{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:2px 16px 6px;scrollbar-width:none}
.vfilter::-webkit-scrollbar{display:none}
.vfilter button{flex:none;font-family:var(--head);font-weight:600;font-size:13px;padding:8px 13px;border-radius:99px;background:var(--surface);color:var(--ink-2)}
.vfilter button[aria-pressed="true"]{color:#000;background:var(--lime)!important}
.vunit{display:flex;align-items:center;gap:9px;margin:18px 2px 10px}
.vunit .n{font-family:var(--head);font-weight:700;font-size:11px;color:#000;padding:5px 10px;border-radius:99px;flex:none}
.vunit b{font-family:var(--jp);font-weight:700;font-size:14px;line-height:1.4}
.vnote{font-size:11.5px;color:var(--ink-3);margin:0 2px 4px;line-height:1.5}

/* 퀴즈 */
.qbox{border-radius:22px;background:var(--card);padding:17px;position:relative;overflow:hidden}
.qprog{display:flex;gap:4px;margin-bottom:14px}
.qprog i{flex:1;height:6px;border-radius:99px;background:var(--surface-2);transition:background .3s}
.qq{font-size:16px;font-weight:600;line-height:1.65;margin-bottom:13px}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{border-radius:14px;background:var(--surface-2);padding:13px 14px;font-family:var(--jp);font-size:15px;line-height:1.5;border:2px solid transparent;width:100%;transition:transform .12s}
.qopt:active{transform:scale(.985)}
.qopt.ko{font-family:var(--ko)}
.qopt.ok{background:var(--good-soft);color:var(--good);font-weight:700;border-color:var(--good)}
.qopt.ng{background:var(--bad-soft);color:var(--bad);animation:shake .4s}
.qwhy{margin-top:12px;border-radius:13px;padding:11px 13px;font-size:12.5px;line-height:1.7;background:var(--surface-2);color:var(--ink-2)}
.qwhy b.tag{display:inline-block;font-family:var(--head);font-weight:700;font-size:12px;color:#000;background:var(--lime)!important;padding:3px 10px;border-radius:99px;margin-bottom:6px;transform:rotate(-2deg)}
.qnextrow{display:flex;justify-content:flex-end;margin-top:12px}
.qnext{font-family:var(--head);font-weight:700;font-size:15px;color:#000;padding:11px 22px;border-radius:99px;background:var(--lime)!important}
.qfin{text-align:center;padding:14px 0 6px}
.qfin .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.qfin p{font-size:13px;color:var(--ink-2);margin:10px 0 14px;line-height:1.6}
.qfin .qnext{display:inline-block}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* 문장 만들기 */
.bprompt{font-size:16px;font-weight:600;line-height:1.6;margin-bottom:12px}
.bprompt small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin-bottom:2px}
.bzone{min-height:62px;border-radius:15px;border:2px dashed var(--line-2);padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:12px;transition:border-color .2s,background .2s}
.bzone.ok{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.bzone.ng{border-style:solid;border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.bbank{display:flex;flex-wrap:wrap;gap:7px;min-height:44px}
.bchip{font-family:var(--jp);font-size:15.5px;padding:9px 12px;border-radius:12px;background:var(--elev);
  animation:popIn .25s both;transition:transform .12s,opacity .2s}
.bchip:active{transform:scale(.94)}
.bchip.used{animation:none;opacity:.25;pointer-events:none;box-shadow:none}
.bans{margin-top:10px;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.bans .j{font-family:var(--jp);font-size:15px;color:var(--ink)}

/* 짝 맞추기 */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12.5px;color:var(--ink-2)}
.mhead b{font-family:var(--head);font-weight:700;font-size:18px;color:#fff}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mcard{min-height:58px;border-radius:15px;background:var(--surface-2);padding:10px;text-align:center;
  display:flex;align-items:center;justify-content:center;font-size:13.5px;line-height:1.4;border:2px solid transparent;transition:transform .15s,opacity .3s,background .2s}
.mcard.j{font-family:var(--jp);font-size:16px}
.mcard.sel{border-color:var(--hl);transform:scale(1.03)}
.mcard.ok{background:var(--good-soft);color:var(--good);opacity:.45;transform:scale(.96);pointer-events:none}
.mcard.bad{background:var(--bad-soft);color:var(--bad);animation:shake .4s}

/* 듣기 */
.lplay{width:112px;height:112px;border-radius:50%;margin:6px auto 8px;display:flex;align-items:center;justify-content:center;color:#000;font-size:42px;background:var(--lime)!important}
.lplay.speaking{animation:pulse 1s infinite}
.lhint{text-align:center;font-size:12px;color:var(--ink-3);margin-bottom:14px}
.lword{text-align:center;font-family:var(--jp);font-size:22px;font-weight:700;margin:4px 0 10px;min-height:1.5em}

/* 카드 */
.fstat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.fstat b{color:var(--ink)}
.fwrap{position:relative;height:300px;margin-bottom:14px;touch-action:pan-y}
.fcard{position:absolute;inset:0;border-radius:26px;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px;
  transition:transform .3s ease,opacity .3s ease;user-select:none;-webkit-user-select:none;cursor:grab}
.fcard.drag{transition:none}
.fcard .fu{position:absolute;top:14px;left:14px;font-family:var(--head);font-weight:700;font-size:11px;color:#000;padding:5px 10px;border-radius:99px}
.fcard .lv{position:absolute;top:16px;right:16px;display:flex;gap:3px}
.fcard .lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.fcard .lv i.on{background:var(--good)}
.fcard .fj{font-family:var(--jp);font-weight:700;font-size:clamp(26px,8.5vw,38px);line-height:1.35;word-break:keep-all}
.fcard .fk{font-size:18px;color:var(--ink-2);margin-top:12px;transition:filter .2s,opacity .2s}
.fcard .fk.hid{filter:blur(8px);opacity:.4}
.fcard .fh{font-size:11.5px;color:var(--ink-3);margin-top:14px}
.fcard .tagk,.fcard .tagn{position:absolute;top:50%;font-family:var(--head);font-size:20px;padding:6px 14px;border-radius:12px;border:3px solid;opacity:0;transition:opacity .15s}
.fcard .tagk{left:18px;color:var(--good);transform:translateY(-50%) rotate(-12deg)}
.fcard .tagn{right:18px;color:var(--bad);transform:translateY(-50%) rotate(12deg)}
.fbtns{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.fbtns button{border-radius:16px;padding:13px 8px;text-align:center;font-family:var(--head);font-weight:700;font-size:15.5px;background:var(--surface)}
.fbtns .no{color:var(--bad)}.fbtns .yes{color:var(--good)}
.fbtns .say{width:52px;font-size:18px;color:var(--ink-2)}

/* 쓰기 */
.ptabs{display:flex;gap:8px;margin-bottom:10px}
.ptabs button{font-family:var(--head);font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:99px;background:var(--surface);color:var(--ink-2)}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{font-family:var(--jp);font-size:15px;line-height:1;padding:9px 11px;border-radius:11px;background:var(--surface);color:var(--ink-2)}
.pchip.on{font-weight:700}
.pcard{border-radius:22px;background:var(--card);padding:15px}
.pinfo{margin-bottom:12px}
.pinfo .pi1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.pinfo .big{font-size:26px;line-height:1.2;font-weight:700}
.pinfo .pko{font-size:14px;color:var(--ink-2)}
.pinfo .pst{font-size:12px;font-weight:700;margin-left:auto}
.pinfo .pi2{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.6}
.pinfo .pi2 b{color:var(--ink-2);font-family:var(--jp);font-weight:600}
.pinfo .pi3{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.9}
.pboard{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--line)}
.pcells{display:grid;gap:1px}
.pcell{position:relative;aspect-ratio:1;background:var(--surface-2)}
.pcell svg{position:absolute;inset:0;width:100%;height:100%}
.pcell svg line{stroke:var(--line);stroke-width:.8;stroke-dasharray:4 4}
.pcell svg line.d{stroke-width:.6;stroke-dasharray:3 5;opacity:.7}
.pcell .ghost{font-family:var(--jp);font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;opacity:.18;user-select:none}
.pcells.noghost .ghost{opacity:0}
.pboard canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.prow{display:flex;gap:8px;margin-top:12px}
.prow button{flex:1;text-align:center;font-family:var(--head);font-weight:600;font-size:13.5px;padding:11px 0;border-radius:12px;background:var(--surface-2);color:var(--ink-2)}
.rules{margin-top:14px;font-size:13px;border-radius:20px;background:var(--card);padding:14px 16px}
.rules>b{font-family:var(--head);font-weight:700;font-size:15px}
.rules ol{margin:7px 0 0;padding-left:19px;font-size:12.5px;line-height:1.85;color:var(--ink-2)}
.rules ol b{color:var(--ink)}

.unav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.unav button{border-radius:18px;background:var(--card);padding:13px 15px}
.unav .lb{font-size:10.5px;font-weight:700;color:var(--ink-3)}
.unav .tt2{font-family:var(--jp);font-weight:700;font-size:13.5px;margin-top:3px;line-height:1.4}
.unav button:disabled{opacity:.35}
.unav .next{text-align:right}

/* 토스트·축하 */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:50;
  background:var(--elev);color:#fff;font-family:var(--head);font-weight:700;font-size:15px;padding:11px 18px;border-radius:99px;
  transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.5s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ── 요약 (Fitness 스타일) ── */
.sumhead{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 14px}
.sumhead h1{margin:0;font-family:var(--head);font-weight:700;font-size:34px;letter-spacing:-.02em;color:#fff}
.ava{display:flex;align-items:center;gap:3px;height:38px;padding:0 12px;border-radius:99px;background:var(--surface);font-size:14px;color:#FF9F0A}
.ava b{font-family:var(--head);font-weight:700;font-size:15px;color:#fff}
.fcardx{display:block;width:100%;border-radius:22px;background:var(--surface);padding:16px 16px 14px;margin-bottom:12px;position:relative;text-align:left;color:#fff}
.fcardx .ct{display:flex;align-items:center;justify-content:space-between;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.01em;margin-bottom:4px}
.chev{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none}
.fcardx .sub{font-size:14.5px;color:var(--ink-2);font-weight:500}
.fcardx .big{font-family:var(--head);font-weight:700;font-size:38px;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.fcardx .big span{font-size:17px;font-weight:700;color:var(--ink-2);letter-spacing:0;margin-left:2px}
.fcardx .big.lime{color:#A4F000}
.rings .rrow{display:flex;align-items:center;gap:22px;padding:8px 0 4px}
.ring3{width:132px;height:132px;flex:none}
.ring3 svg{width:100%;height:100%;transform:rotate(-90deg)}
.rst{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.rst small{display:block;font-size:14px;color:#fff;font-weight:500}
.rst b{display:block;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.01em}
.rst b span{font-size:12px;margin-left:1px;letter-spacing:.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.grid2 .fcardx{margin:0;min-height:196px;display:flex;flex-direction:column}
.grid2 .ct{font-size:19px}
.bars{display:flex;align-items:flex-end;gap:5px;height:56px;margin-top:auto;padding-top:10px}
.bars i{flex:1;border-radius:2px 2px 0 0;min-height:4px}
.bl{display:flex;justify-content:space-between;margin-top:6px}
.bl span{flex:1;text-align:center;font-size:9.5px;color:var(--ink-3)}
.sico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#3A3A3C,#1C1C1E);font-family:var(--pop);font-size:20px;color:#A4F000;margin:4px 0 8px}
.sub2{font-size:15px;font-weight:600;color:#fff}
.sub3{font-size:12.5px;color:var(--ink-2);margin-top:auto;padding-top:6px}
.sub2.c,.sub3.c{text-align:center}
.bwrap2{display:flex;justify-content:center;padding:4px 0 2px}
.hex{width:96px;height:96px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.hex.off{filter:grayscale(1) opacity(.35)}
.trs{display:grid;grid-template-columns:1fr 1fr;gap:16px 10px;padding:8px 0 4px}
.tr{display:flex;align-items:center;gap:12px}
.tr i{width:40px;height:40px;border-radius:50%;--trc:var(--bgc);background:var(--surface-2)!important;flex:none;position:relative}
.tr i::after{content:"";position:absolute;left:11px;top:18px;width:18px;height:4px;border-radius:2px;background:var(--trc,#fff)}
.tr small{display:block;font-size:14px;color:#fff;font-weight:500}
.tr b{display:block;font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:-.01em}
.tr b span{font-size:12px;margin-left:1px}
.trnote{font-size:11.5px;color:var(--ink-3);margin:6px 0 0;line-height:1.5}
.wide{display:block;width:100%;text-align:center;font-family:var(--head);font-weight:600;font-size:18px;color:#A4F000;background:var(--surface);border-radius:22px;padding:17px;margin-top:12px}
.resume{display:flex;align-items:center;gap:12px;padding:12px 14px}
.resume .sico{margin:0}
.resume .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.resume .rt b{font-family:var(--head);font-weight:700;font-size:17px}
.resume .rt small{font-size:12.5px;color:var(--ink-2)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.gtile{border-radius:22px;padding:14px 14px 13px;background:var(--surface);color:#fff;position:relative;min-height:124px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.gtile .gk{position:absolute;top:12px;left:14px;font-family:var(--pop);font-size:22px;color:var(--tc)}
.gtile::before{content:"›";position:absolute;top:12px;right:14px;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
.gtile b{font-family:var(--head);font-weight:700;font-size:17px}
.gtile small{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.gtile.off{opacity:.45}
.offline{font-size:11px;color:var(--ink-3);text-align:center;margin:18px 0 4px}

/* ── 요약 · Fitness-like (черный фон, кольца активности) ── */
.sumhead{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 2px 16px}
.sumhead .dt{font-size:13px;font-weight:600;color:#8E8E93;letter-spacing:.02em}
.sumhead h1{margin:0;font-family:var(--head);font-weight:700;font-size:34px;letter-spacing:-.02em;color:#fff}
.streakp{display:flex;align-items:center;gap:6px;background:var(--surface);color:#FF9F0A;padding:8px 12px;border-radius:99px;font-size:14px;font-weight:700;margin-top:8px}
.streakp b{color:#fff;font-family:var(--head);font-weight:700}
.actcard{display:flex;align-items:center;gap:18px;background:var(--surface);border-radius:22px;padding:18px;margin-bottom:12px}
.rings{width:138px;height:138px;flex:none}
.rings svg{width:100%;height:100%;display:block}
.rings rect{fill:none;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
.rings .tr{stroke:rgba(255,255,255,.12)}
.stats{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.stats small{display:block;font-size:13px;font-weight:600;color:#8E8E93}
.stats b{display:block;font-family:var(--head);font-weight:700;font-size:23px;letter-spacing:-.01em;color:#fff;line-height:1.1}
.stats b span{font-size:13px;font-weight:600;color:#8E8E93;margin-left:2px}
.stats .tm{padding-top:8px;border-top:1px solid var(--line)}
.sh{display:flex;align-items:center;justify-content:space-between;font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:-.01em;color:#fff;margin:20px 2px 10px}
.sh .more{font-size:15px;font-weight:600;color:var(--lime)}
.tasks{background:var(--surface);border-radius:22px;padding:4px 16px}
.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.task:last-child{border:0}
.task .cb{width:26px;height:26px;border-radius:50%;border:2px solid var(--elev);display:flex;align-items:center;justify-content:center;font-size:14px;color:#000;font-weight:700;flex:none}
.task .cb.ok{background:var(--lime);border-color:var(--lime)}
.task .tx{flex:1;font-size:16px;font-weight:600;color:#fff}
.task .tx small{display:block;font-size:12.5px;font-weight:500;color:#8E8E93;margin-top:2px}
.task .pct{font-size:14px;font-weight:600;color:#8E8E93}
.scroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.ucar{flex:none;width:156px;border-radius:20px;overflow:hidden;background:var(--surface);text-align:left}
.ucar.lock{opacity:.45}
.uph{height:96px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.uph img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.lk2{font-size:22px}
.ub{padding:10px 12px 12px}
.ub b{display:block;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub small{font-size:12px;color:#8E8E93}
.pb{height:4px;border-radius:99px;background:var(--elev);margin-top:8px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:var(--lime)}

/* ── 하단 панель · Fitness-like ── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 24px calc(10px + env(safe-area-inset-bottom));
  background:rgba(28,28,30,.82);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;color:#8E8E93;font-size:11px;font-weight:600}
.tabbar button svg{width:26px;height:26px}
.tabbar button.on{color:var(--lime)}

lass=\"jp\">「は</span> ~<span class=\"jp\">です」</span>로 말합니다. 요일은 전부 「~<span class=\"jp\">ようび」</span>로 끝납니다.", "ex": [[[["きょうは なんようびですか。", null]], "오늘은 무슨 요일입니까?"], [[["テストは あさって、きんようびからです。", null]], "시험은 모레, 금요일부터입니다."], [[["これは らいねんの カレンダーです。", null]], "이것은 내년 달력입니다."]], "note": "날: <span class=\"jp\">おととい</span>(그저께) · <span class=\"jp\">きのう</span> · <span class=\"jp\">きょう</span> · <span class=\"jp\">あした</span> · <span class=\"jp\">あさって</span>(모레) / 해: <span class=\"jp\">きょねん</span> · <span class=\"jp\">ことし</span> · <span class=\"jp\">らいねん</span>"}, {"u": 3, "t": [["いま、はちじ はんです。", null]], "sub": "지금 8시 반입니다", "desc": "시각은 「~<span class=\"jp\">じ」</span>, 분은 「~<span class=\"jp\">ふん</span>/~<span class=\"jp\">ぷん」</span>, 30분은 <span class=\"jp\">「はん」</span>입니다.", "ex": [[[["いま、なんじですか。", null]], "지금 몇 시입니까?"], [[["いま、くじ はんです。", null]], "지금 9시 반입니다."], [[["かいぎは ごぜん じゅうじからです。", null]], "회의는 오전 10시부터입니다."]], "note": "<b>시각의 예외 3개</b>: 4시 <span class=\"jp\">よじ</span> · 7시 <span class=\"jp\">しちじ</span> · 9시 <span class=\"jp\">くじ</span>. (<span class=\"jp\">よんじ</span>·<span class=\"jp\">ななじ</span>·<span class=\"jp\">きゅうじ</span> ✕)"}, {"u": 3, "t": [["Aは Bでした。", null]], "sub": "A는 B였습니다", "desc": "명사의 과거 긍정입니다. <span class=\"jp\">「です」</span>를 <span class=\"jp\">「でした」</span>로 바꾸기만 하면 됩니다.", "ex": [[[["きのうは やすみでした。", null]], "어제는 쉬는 날이었습니다."], [[["きのうの かいぎは じゅうじでした。", null]], "어제 회의는 10시였습니다."], [[["きのうは なんようびでしたか。", null]], "어제는 무슨 요일이었습니까?"]], "note": "<span class=\"jp\">「いま</span>·<span class=\"jp\">げんざい</span> → <span class=\"jp\">です」</span> / <span class=\"jp\">「きのう</span>·<span class=\"jp\">むかし</span> → <span class=\"jp\">でした」</span>"}, {"u": 3, "t": [["Aは Bじゃ ありませんでした。", null]], "sub": "A는 B가 아니었습니다", "desc": "명사의 과거 부정입니다. <span class=\"jp\">「じゃ</span> <span class=\"jp\">ありません」</span>에 <span class=\"jp\">「でした」</span>를 붙입니다.", "ex": [[[["きのうは やすみじゃ ありませんでした。", null]], "어제는 쉬는 날이 아니었습니다."], [[["きのうは あめじゃ ありませんでした。", null]], "어제는 비가 아니었습니다."], [[["わたしは せんせいでは ありませんでした。", null]], "저는 선생님이 아니었습니다."]], "note": "4형태 세트로 외우세요 — <span class=\"jp\">です</span> / <span class=\"jp\">でした</span> / <span class=\"jp\">じゃ</span> <span class=\"jp\">ありません</span> / <span class=\"jp\">じゃ</span> <span class=\"jp\">ありませんでした</span>"}, {"u": 4, "t": [["~いです。/ ~いですね。", null]], "sub": "~합니다 / ~하네요", "desc": "<span class=\"jp\">い</span>형용사는 그대로 <span class=\"jp\">「です」</span>를 붙입니다. <span class=\"jp\">「ね」</span>를 붙이면 공감·확인이 됩니다.", "ex": [[[["この パンは おいしいです。", null]], "이 빵은 맛있습니다."], [[["きょうは とても あついですね。", null]], "오늘은 매우 덥네요."], [[["この もんだい、むずかしいですね。", null]], "이 문제 어렵네요."]], "note": "<span class=\"jp\">い</span>형용사에 <span class=\"jp\">「な」</span>를 넣지 않습니다. <span class=\"jp\">「あついな</span> <span class=\"jp\">ひ」</span>(✕) / <span class=\"jp\">「あつい</span> <span class=\"jp\">ひ」</span>(○)"}, {"u": 4, "t": [["~くて", null]], "sub": "~하고 (い형용사 연결)", "desc": "마지막 <span class=\"jp\">「い」</span>를 떼고 <span class=\"jp\">「くて」</span>를 붙여 여러 성질을 연결합니다. <b>앞에는 <span class=\"jp\">い</span>형용사만 올 수 있습니다.</b>", "ex": [[[["この ケーキは やすくて おいしいです。", null]], "이 케이크는 싸고 맛있습니다."], [[["この ざるそばは つめたくて おいしいですね。", null]], "이 자루소바는 차갑고 맛있네요."], [[["なつは あつくて、ふゆは さむいです。", null]], "여름은 덥고, 겨울은 춥습니다."]], "note": "예외 <b><span class=\"jp\">いい</span> → <span class=\"jp\">よくて</span></b> (<span class=\"jp\">いくて</span> ✕). <span class=\"jp\">な</span>형용사는 「~<span class=\"jp\">で」</span>를 씁니다."}, {"u": 4, "t": [["~く ありません / ~く ないです", null]], "sub": "~하지 않습니다", "desc": "<span class=\"jp\">い</span>형용사의 부정입니다. 「~<span class=\"jp\">く</span> <span class=\"jp\">ありません」</span>이 정중하고, 「~<span class=\"jp\">く</span> <span class=\"jp\">ないです」</span>가 조금 더 부드럽습니다.", "ex": [[[["きょうは あつく ありませんね。", null]], "오늘은 덥지 않네요."], [[["あの メロンは あまく ないです。", null]], "저 멜론은 달지 않습니다."], [[["すしは やすく ありません。", null]], "초밥은 싸지 않습니다."]], "note": "예외 <b><span class=\"jp\">いい</span> → <span class=\"jp\">よく</span> <span class=\"jp\">ありません</span></b> (<span class=\"jp\">いくありません</span> ✕). <span class=\"jp\">「あまいくありません」</span>(✕) — <span class=\"jp\">い</span>를 반드시 뗍니다."}, {"u": 4, "t": [["い형용사 + 명사", null]], "sub": "~한 ~", "desc": "<span class=\"jp\">い</span>형용사는 아무것도 붙이지 않고 명사 앞에 그대로 놓습니다.", "ex": [[[["むしあつい ひです。", null]], "무더운 날입니다."], [[["あたらしい くるまです。", null]], "새 차입니다."], [[["やさしい ", null], ["人", "ひと"], ["です。", null]], "상냥한 사람입니다."]], "note": "자주 쓰는 <span class=\"jp\">い</span>형용사: <span class=\"jp\">あつい</span>·<span class=\"jp\">さむい</span>·<span class=\"jp\">おいしい</span>·<span class=\"jp\">たかい</span>·<span class=\"jp\">やすい</span>·<span class=\"jp\">ながい</span>·<span class=\"jp\">みじかい</span>·<span class=\"jp\">おおきい</span>·<span class=\"jp\">ちいさい</span>·<span class=\"jp\">たのしい</span>·<span class=\"jp\">むずかしい</span>"}, {"u": 5, "t": [["な형용사 + な + 명사", null]], "sub": "~한 ~", "desc": "<span class=\"jp\">な</span>형용사는 명사 앞에서 <b><span class=\"jp\">「な」</span>를 붙입니다.</b> 명사 뒤에서는 그냥 <span class=\"jp\">「です」</span>.", "ex": [[[["まじめな ", null], ["人", "ひと"], ["です。", null]], "성실한 사람입니다."], [[["この ", null], ["部屋", "へや"], ["は しずかです。", null]], "이 방은 조용합니다."], [[["すてきな ともだちですね。", null]], "멋진 친구네요."]], "note": "<b>함정</b>: <span class=\"jp\">きれい</span> · <span class=\"jp\">ゆうめい</span> · <span class=\"jp\">きらい</span>는 <span class=\"jp\">い</span>로 끝나지만 <b><span class=\"jp\">な</span>형용사</b>입니다. <span class=\"jp\">きれいな</span> <span class=\"jp\"><ruby>花<rt>はな</rt></ruby></span>(○)"}, {"u": 5, "t": [["~で", null]], "sub": "~하고 (な형용사 연결)", "desc": "<span class=\"jp\">な</span>형용사·명사를 연결할 때는 <span class=\"jp\">「で」</span>를 씁니다. <span class=\"jp\">い</span>형용사의 <span class=\"jp\">「くて」</span>에 대응합니다.", "ex": [[[["かれは ハンサムで、やさしくて、まじめです。", null]], "그는 잘생기고 상냥하고 성실합니다."], [[["この ホテルは きれいで、しずかで、べんりです。", null]], "이 호텔은 깨끗하고 조용하고 편리합니다."], [[["うみは きれいで、たのしいです。", null]], "바다는 깨끗하고 즐겁습니다."]], "note": "<span class=\"jp\">きれいくて</span> (✕) / <span class=\"jp\">きれいで</span> (○) — <span class=\"jp\">な</span>형용사는 절대 <span class=\"jp\">「くて」</span>를 쓰지 않습니다."}, {"u": 5, "t": [["~じゃ ありません / あまり ~ない", null]], "sub": "~하지 않습니다 / 그다지 ~않습니다", "desc": "<span class=\"jp\">な</span>형용사·명사의 부정입니다. <span class=\"jp\">「あまり」</span>를 앞에 붙이면 「그다지 ~않다」가 됩니다.", "ex": [[[["あまり まじめじゃ ありません。", null]], "그다지 성실하지 않습니다."], [[["この ", null], ["店", "みせ"], ["は べんりでは ありません。", null]], "이 가게는 편리하지 않습니다."], [[["きょうは あまり いそがしく ありません。", null]], "오늘은 그다지 바쁘지 않습니다."]], "note": "<span class=\"jp\">「あまり」</span>는 <b>반드시 부정과 함께</b> 씁니다. <span class=\"jp\">「あまり</span> <span class=\"jp\">いいです」</span>(✕)"}, {"u": 5, "t": [["~が すきです / じょうずです", null]], "sub": "~를 좋아합니다 / 잘합니다", "desc": "좋아함·능숙함의 대상에는 <b><span class=\"jp\">「を」</span>가 아니라 <span class=\"jp\">「が」</span></b>를 씁니다.", "ex": [[[["かれは おんがくが すきです。", null]], "그는 음악을 좋아합니다."], [[["ケンさんは テニスが じょうずです。", null]], "켄 씨는 테니스를 잘합니다."], [[["日本語", "にほんご"], ["が ", null], ["上手", "じょうず"], ["ですね。", null]], "일본어를 잘하시네요."]], "note": "<span class=\"jp\">「音楽を</span> <span class=\"jp\">すきです」</span>(✕). 같은 부류: <span class=\"jp\">わかる</span> · <span class=\"jp\">できる</span> · <span class=\"jp\">ほしい</span>도 <span class=\"jp\">「が」</span>를 씁니다."}, {"u": 6, "t": [["ここ・そこ・あそこ・どこ", null]], "sub": "여기·거기·저기·어디", "desc": "장소를 가리키는 말입니다. <span class=\"jp\">これ</span> 계열과 같은 거리 감각입니다.", "ex": [[[["ふくやは ここですね。", null]], "옷가게는 여기네요."], [[["トイレは どこですか。", null]], "화장실은 어디입니까?"], [[["あそこに えきが あります。", null]], "저기에 역이 있습니다."]], "note": "정중하게는 <b><span class=\"jp\">こちら</span>·<span class=\"jp\">そちら</span>·<span class=\"jp\">あちら</span>·<span class=\"jp\">どちら</span></b>를 씁니다. 비즈니스에서는 <span class=\"jp\">どちら</span>가 안전합니다."}, {"u": 6, "t": [["~に あります / ありません", null]], "sub": "~에 있습니다 / 없습니다", "desc": "사물의 존재를 말합니다. 존재하는 장소에는 <b><span class=\"jp\">「に」</span></b>를 씁니다.", "ex": [[[["ベージュは ここに あります。", null]], "베이지색은 여기 있습니다."], [[["デパートは あそこに あります。", null]], "백화점은 저기에 있습니다."], [[["きいろは ありますか。", null]], "노란색은 있습니까?"]], "note": "사물·식물은 <b><span class=\"jp\">あります</span></b>, 사람·동물은 <b><span class=\"jp\">います</span></b>. 가게에서는 정중형 <b><span class=\"jp\">「ございます」</span></b>를 씁니다."}, {"u": 6, "t": [["~を ください。", null]], "sub": "~를 주세요", "desc": "물건을 요청하는 기본 표현입니다. 목적어에는 <span class=\"jp\">「を」</span>를 씁니다.", "ex": [[[["ベージュを 2まい ください。", null]], "베이지색을 두 장 주세요."], [[["これを ください。", null]], "이걸 주세요."], [[["コーヒーを ひとつ ください。", null]], "커피 하나 주세요."]], "note": "더 정중하게는 「~<span class=\"jp\">を</span> <span class=\"jp\">おねがいします」</span>. 점원의 응답은 <span class=\"jp\">「かしこまりました」</span>."}, {"u": 6, "t": [["조수사 ~まい / ~ほん / ~つ", null]], "sub": "~장 / ~자루 / ~개", "desc": "세는 물건의 모양에 따라 단위가 달라집니다. 납작한 것=<span class=\"jp\">まい</span>, 길쭉한 것=<span class=\"jp\">ほん</span>, 둥근 것=<span class=\"jp\">つ</span>.", "ex": [[[["シャツを さんまい かいます。", null]], "셔츠를 세 장 삽니다."], [[["ビールを いっぽん ください。", null]], "맥주를 한 병 주세요."], [[["アイスクリームを みっつ ください。", null]], "아이스크림을 세 개 주세요."]], "note": "<b>~<span class=\"jp\">ほん</span>의 음 변화</b>: 1 <span class=\"jp\">いっぽん</span> · 3 <span class=\"jp\">さんぼん</span> · 6 <span class=\"jp\">ろっぽん</span> · 8 <span class=\"jp\">はっぽん</span> · 10 <span class=\"jp\">じゅっぽん</span>. 나머지는 ~<span class=\"jp\">ほん</span>."}, {"u": 6, "t": [["~で ~えんです。", null]], "sub": "~에 ~엔입니다", "desc": "수량이나 묶음의 합계 금액을 말합니다. <span class=\"jp\">「で」</span>가 「~해서·~에」의 뜻입니다.", "ex": [[[["2まいで 3,000えんです。", null]], "두 장에 3,000엔입니다."], [[["この たまごは さんこで 500えんです。", null]], "이 달걀은 세 개에 500엔입니다."], [[["ぜんぶで いくらですか。", null]], "전부 얼마입니까?"]], "note": "<b>금액 예외 3개</b>: 600 <span class=\"jp\">ろっぴゃく</span> · 3,000 <span class=\"jp\">さんぜん</span> · 10,000 <span class=\"jp\">いちまん</span>."}];
const Q = [{"u": 1, "q": "「저는 회사원입니다」를 일본어로?", "o": ["わたしは かいしゃいんです。", "わたしが かいしゃいんです。", "わたしは かいしゃいんが。"], "w": "자기소개는 「が」가 아니라 「は」를 씁니다."}, {"u": 1, "q": "「ミンさんは がくせいですか。」의 부정 대답은?", "o": ["いいえ、がくせいじゃ ありません。", "いいえ、がくせいく ありません。", "いいえ、がくせいでした。"], "w": "명사의 부정은 「じゃ ありません」입니다. 「く ありません」은 い형용사용입니다."}, {"u": 1, "q": "거래처에 자기 회사 부장을 소개할 때 맞는 것은?", "o": ["こちらは 部長の 田中です。", "こちらは 田中部長さんです。", "あれは 田中さんです。"], "w": "자기 회사 사람은 さん을 붙이지 않습니다. 또 사람에게 「あれ」는 무례합니다."}, {"u": 2, "q": "(  )に かばんは わたしのです。 — 빈칸에 맞는 것은?", "o": ["この", "これ", "ここ"], "w": "뒤에 명사 「かばん」이 있으므로 「この」입니다. 「これ」는 단독으로만 씁니다."}, {"u": 2, "q": "「それは なんですか」에서 それ가 가리키는 것은?", "o": ["상대 쪽에 있는 것", "내 쪽에 있는 것", "둘 다에게서 먼 것"], "w": "これ=내 쪽 / それ=상대 쪽 / あれ=둘 다에게서 먼 것."}, {"u": 2, "q": "「그 스마트폰은 제 것입니다」를 일본어로?", "o": ["その スマホは わたしのです。", "その スマホは わたしです。", "これ スマホは わたしのです。"], "w": "명사를 생략하고 소유만 말할 때는 「~のです」입니다."}, {"u": 2, "q": "사람을 가리킬 때 쓸 수 없는 것은?", "o": ["あれ", "あの方", "この人"], "w": "사람에게 これ·それ·あれ를 쓰면 무례합니다. この人 또는 あの方를 씁니다."}, {"u": 3, "q": "「지금 9시 반입니다」를 일본어로?", "o": ["いま、くじ はんです。", "いま、きゅうじ はんです。", "いま、ここのじ はんです。"], "w": "9시는 「くじ」입니다. 4시 よじ · 7시 しちじ와 함께 예외 3개입니다."}, {"u": 3, "q": "「きのうは やすみでした」의 부정은?", "o": ["きのうは やすみじゃ ありませんでした。", "きのうは やすみじゃ ありません。", "きのうは やすみく ありませんでした。"], "w": "과거 부정은 「じゃ ありません」 + 「でした」입니다."}, {"u": 3, "q": "날짜 「1日」의 바른 읽기는?", "o": ["ついたち", "いちにち", "ひとひ"], "w": "날짜로서의 1日은 「ついたち」입니다. 「いちにち」는 「하루(기간)」라는 뜻입니다."}, {"u": 3, "q": "「4日」의 바른 읽기는?", "o": ["よっか", "ようか", "よんにち"], "w": "よっか가 4일, ようか는 8일입니다. 자주 혼동됩니다."}, {"u": 4, "q": "「この ケーキは やすい + おいしい」를 연결하면?", "o": ["やすくて おいしいです", "やすいで おいしいです", "やすくで おいしいです"], "w": "い형용사의 연결은 い를 떼고 「くて」입니다."}, {"u": 4, "q": "「오늘은 덥지 않습니다」를 일본어로?", "o": ["きょうは あつく ありません。", "きょうは あついく ありません。", "きょうは あつじゃ ありません。"], "w": "い를 떼고 「く ありません」을 붙입니다."}, {"u": 4, "q": "「いい」의 부정형은?", "o": ["よく ありません", "いく ありません", "いいじゃ ありません"], "w": "いい는 활용할 때 よ로 바뀝니다. よくない · よかった · よくて."}, {"u": 4, "q": "い형용사가 명사를 꾸밀 때 맞는 것은?", "o": ["あつい ひ", "あついな ひ", "あつくの ひ"], "w": "い형용사는 아무것도 붙이지 않고 그대로 명사 앞에 놓습니다."}, {"u": 5, "q": "「きれい」의 연결형으로 맞는 것은?", "o": ["きれいで", "きれいくて", "きれくて"], "w": "きれい는 い로 끝나 보이지만 **な형용사**입니다. 연결은 「で」."}, {"u": 5, "q": "「まじめな 人」에서 「な」가 붙는 이유는?", "o": ["な형용사가 명사를 꾸미기 때문", "い형용사이기 때문", "과거형이기 때문"], "w": "な형용사는 명사 앞에서 반드시 「な」를 붙입니다."}, {"u": 5, "q": "「그는 음악을 좋아합니다」를 일본어로?", "o": ["かれは おんがくが すきです。", "かれは おんがくを すきです。", "かれは おんがくで すきです。"], "w": "すき·じょうず·わかる·できる의 대상에는 「が」를 씁니다."}, {"u": 5, "q": "「あまり」와 함께 쓸 수 없는 것은?", "o": ["あまり いいです", "あまり よく ありません", "あまり まじめじゃ ありません"], "w": "「あまり」는 반드시 부정과 함께 씁니다."}, {"u": 5, "q": "다음 중 な형용사가 아닌 것은?", "o": ["たのしい", "きれい", "ゆうめい"], "w": "たのしい는 い형용사입니다. きれい·ゆうめい는 い로 끝나지만 な형용사입니다."}, {"u": 6, "q": "「베이지색은 여기 있습니다」를 일본어로?", "o": ["ベージュは ここに あります。", "ベージュは ここで あります。", "ベージュは ここに います。"], "w": "존재 장소는 「に」, 사물에는 「あります」입니다."}, {"u": 6, "q": "셔츠 3장을 세는 말은?", "o": ["さんまい", "さんぼん", "みっつ"], "w": "납작한 것은 「~まい」입니다. 옷·종이·수건 등."}, {"u": 6, "q": "「ビールを 1( )ください」 — 빈칸은?", "o": ["いっぽん", "いちほん", "いっほん"], "w": "~ほん은 1·3·6·8·10에서 음이 바뀝니다. 1은 いっぽん."}, {"u": 6, "q": "3,000엔의 바른 읽기는?", "o": ["さんぜんえん", "さんせんえん", "みせんえん"], "w": "3,000은 「さんぜん」입니다. 600 ろっぴゃく · 10,000 いちまん과 함께 예외 3개."}, {"u": 6, "q": "가게에서 「있습니까?」를 가장 정중하게 물으면?", "o": ["ございますか。", "ありますか。", "いますか。"], "w": "「ございます」는 「あります」의 정중어입니다. 점원이 손님에게 씁니다."}, {"u": 6, "q": "「전부 얼마입니까?」를 일본어로?", "o": ["ぜんぶで いくらですか。", "ぜんぶに いくらですか。", "ぜんぶは なんですか。"], "w": "합계에는 「で」를 씁니다. 가격은 「いくら」."}, {"u": 1, "q": "「どうぞ よろしく おねがいします」의 뜻은?", "o": ["잘 부탁드립니다", "처음 뵙겠습니다", "정말 감사합니다"], "w": "「はじめまして」로 시작해 「どうぞ よろしく おねがいします」로 끝맺는 것이 자기소개의 기본 세트입니다."}, {"u": 1, "q": "조사로 쓰인 「は」를 읽는 법은?", "o": ["わ", "は", "ば"], "w": "조사일 때만 「わ」로 읽습니다. 단어 안의 は(예: はな)는 그대로 「は」."}, {"u": 1, "q": "「선생님」에 해당하는 단어는?", "o": ["せんせい", "がくせい", "かいしゃいん"], "w": "せんせい=선생님 / がくせい=학생 / かいしゃいん=회사원."}, {"u": 1, "q": "거래처 문서에 쓰기 알맞은 부정 표현은?", "o": ["かいしゃいんでは ありません", "かいしゃいんじゃ ありません", "かいしゃいんく ありません"], "w": "「じゃ」는 회화체입니다. 격식이 필요한 자리에서는 「では ありません」."}, {"u": 1, "q": "「ミンさんは がくせいですか」의 긍정 대답은?", "o": ["はい、そうです。", "はい、ちがいます。", "はい、そうでした。"], "w": "긍정은 「はい、そうです」, 부정은 「いい /* ───────── 데이터 ───────── */
const UNITS = META.map(m=>m[0]);
const metaOf = u => META.find(m=>m[0]===u);
const strip = s => s.replace(/<[^>]+>/g,'');
const who = s => s.replace(/\{.*?\}/g,'');
const DLG = {};
UNITS.forEach(u=>{
  const x=DX[u]||{t0:'',d:[]};
  DLG[u]=[{t:x.t0, img:IMG[metaOf(u)[5]], lines:(CONV[u]||[]).map(l=>({w:who(l[0]), s:l[1], j:strip(l[2]), k:l[3]}))},
    ...x.d.map((d,i)=>({t:d.t, img:`img/u${u}d${i+2}c.webp`, lines:d.lines.map(l=>({w:who(l[0]), s:l[1], j:l[2], k:l[3]}))}))];
});
function dxWords(u){
  const have=new Set((W[u]||[]).map(w=>w[0])), out=[];
  for(const d of (DX[u]?.d||[])) for(const w of d.w) if(!have.has(w[0])){ have.add(w[0]); out.push(w); }
  return out;
}
const unitWords = u => [...(W[u]||[]).map(w=>({j:w[0],k:w[1],u,x:0})), ...dxWords(u).map(w=>({j:w[0],k:w[1],u,x:1}))];
const poolOf = g => (g==='all'?UNITS:[g]).flatMap(unitWords);
const ALLW = poolOf('all');
const lvl = j => S.box[j]||0;
const MASTER = 3;
const dueCount = () => ALLW.filter(w=>lvl(w.j)<MASTER).length;

/* ───────── 진도·XP ───────── */
const STEPS=8, GOAL=30;
const TABS=[['conv','話','회화'],['gram','文','문법'],['words','語','단어'],['write','書','쓰기'],['quiz','問','퀴즈']];
const TABKEY={gram:'g',words:'w',write:'p',quiz:'q'};
function P(u){ const p=S.prog[u]||(S.prog[u]={}); p.c=p.c||[0,0,0,0]; return p; }
const doneCount = u => { const p=P(u); return p.c.filter(Boolean).length+['g','w','p','q'].filter(k=>p[k]).length; };
const tabDone = (u,t) => t==='conv' ? P(u).c.every(Boolean) : !!P(u)[TABKEY[t]];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const yday = () => { const d=new Date(); d.setDate(d.getDate()-1); return ymd(d); };
const streakNow = () => (S.day===ymd(new Date())||S.day===yday()) ? S.streak : 0;
const todayXP = () => S.day===ymd(new Date()) ? S.dxp : 0;
// 일별 기록: xp, cnv(완료한 대화), wd(복습한 단어), sec(학습 시간), q(퀴즈 점수)
const H = d => S.hist[d] || (S.hist[d] = {xp:0,cnv:0,wd:0,sec:0,q:[]});
const TODAY = () => H(ymd(new Date()));
function bump(k,n){ TODAY()[k]=(TODAY()[k]||0)+n; const ks=Object.keys(S.hist).sort(); while(ks.length>60) delete S.hist[ks.shift()]; save(); }
const lastDays = n => [...Array(n)].map((_,i)=>{ const d=new Date(); d.setDate(d.getDate()-(n-1)+i); return ymd(d); });
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
// 학습 시간: 화면이 보이고 학습 화면일 때 5초마다 적립
setInterval(()=>{ if(document.visibilityState==='visible' && V && V.v!=='home' && V.v!=='learn') bump('sec',5); },5000);
function addXP(n){
  const t=ymd(new Date());
  if(S.day!==t){ S.streak = S.day===yday() ? S.streak+1 : 1; S.day=t; S.dxp=0; }
  const before=S.dxp; S.xp+=n; S.dxp+=n; bump('xp',n);
  if(before<GOAL && S.dxp>=GOAL) setTimeout(()=>{ toast('오늘 목표 달성! 🔥 '+S.streak+'일 연속'); confetti(); },700);
}
function mark(u,key,i){
  const p=P(u), was = key==='c' ? p.c[i] : p[key];
  if(key==='c') p.c[i]=1; else p[key]=1;
  save(); if(!was&&key==='c') bump('cnv',1);
  if(!was){ addXP(10); toast('+10 XP · 완료!'); buzz(15);
    if(doneCount(u)===STEPS) setTimeout(()=>{ toast(`UNIT 0${u} 모두 완료! 🎉`); confetti(); },900); }
  return !was;
}

/* ───────── 음성 (TTS) ───────── */
const TTS={
  ok:'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window, voice:null, id:0,
  init(){ if(!this.ok) return;
    const pick=()=>{ const vs=speechSynthesis.getVoices().filter(v=>/^ja([-_]|$)/i.test(v.lang));
      this.voice = vs.find(v=>/kyoko|o-ren|siri|google|nanami|haruka/i.test(v.name)) || vs[0] || null; };
    pick(); speechSynthesis.addEventListener?.('voiceschanged',pick); },
  clean: t => strip(t).replace(/[~～]/g,'').replace(/\{.*?\}/g,'').trim(),
  speak(text,onend){
    if(!this.ok){ onend&&onend(); return; }
    const id=++this.id, u=new SpeechSynthesisUtterance(this.clean(text));
    u.lang='ja-JP'; if(this.voice) u.voice=this.voice; u.rate=S.rate||0.9;
    const fin=()=>{ if(id===this.id){ this.id++; onend&&onend(); } };
    u.onend=fin; u.onerror=fin;
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(()=>{ if(id===this.id) speechSynthesis.speak(u); },60); }
    else speechSynthesis.speak(u);
  },
  stop(){ if(this.ok){ this.id++; speechSynthesis.cancel(); } }
};
TTS.init();
function clearSpeaking(){ document.querySelectorAll('.speaking').forEach(x=>x.classList.remove('speaking')); }
function sayEl(el,onend){
  clearSpeaking(); el.classList.add('speaking');
  TTS.speak(el.dataset.say,()=>{ el.classList.remove('speaking'); onend&&onend(); });
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-say]'); if(!el) return;

});

function confetti(){

}

const bubble=(l,u,o={})=>`<div class="bub ${l.s}${o.me?' me':''}${o.anim?' pop':''}${o.hid?' hid':''}">

function renderChat(u,d,di){

function sizePad(){
  const cv=document.getElementById('pcv'); if(!cv||!pCtx) return;
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const d=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
  pCtx.setTransform(d,0,0,d,0,0); pCtx.lineCap='round'; pCtx.lineJoin='round';
  pCtx.lineWidth=Math.max(4, r.width*0.014); pCtx.strokeStyle=getComputedStyle(document.body).color;
}
function pClear(){ const cv=document.getElementById('pcv'); if(cv&&pCtx) pCtx.clearRect(0,0,cv.width,cv.height); }
function bindPad(cv){
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); pDraw=true; pLast=pt(e);
    pCtx.beginPath(); pCtx.moveTo(pLast.x,pLast.y); pCtx.lineTo(pLast.x+.1,pLast.y+.1); pCtx.stroke(); };
  cv.onpointermove=e=>{ if(!pDraw) return; e.preventDefault(); const p=pt(e);
    pCtx.beginPath(); pCtx.moveTo(pLast.x,pLast.y); pCtx.lineTo(p.x,p.y); pCtx.stroke(); pLast=p; };
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{pDraw=false;}));
}

function startQuiz(u){

function renderQ(u){
  const box=document.getElementById('qbox');
  const prog=`<div class="qprog">${qs.map((_,i)=>`<i style="${i<qi?`background:${C(u)}`:''}"></i>`).join('')}</div>`;
  if(qi>=qs.length){
    const perfect=qsc===qs.length;
    if(S.best[u]==null||qsc>S.best[u]){ S.best[u]=qsc; save(); }
    mark(u,'q'); addXP(qsc); TODAY().q=(TODAY().q||[]).concat(qsc); save(); refreshTabs();
    if(perfect) confetti();
    box.innerHTML=`${prog}<div class="qfin"><div class="big" style="color:${C(u)}">${qsc} / ${qs.length}</div>
      <p>${perfect?'완벽합니다! 다음 단원으로 넘어가세요.':'틀린 문제의 해설을 확인하고 다시 도전해 보세요.'}<br>+${qsc} XP</p>
      <button class="qnext press" style="background:${grad(u)}" id="qRe">${IC.redo} 다시 풀기</button></div>`;
    document.getElementById('qRe').onclick=()=>startQuiz(u);
    return;
  }
  const q=qs[qi];
  box.innerHTML=`${prog}<div class="qq">${jp(q.q)}</div>
    <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}">${o.t}</button>`).join('')}</div><div id="qtail"></div>`;
  box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, ok=q.opts[i].ok;
    box.querySelectorAll('.qopt').forEach((x,k)=>{ x.disabled=true; if(q.opts[k].ok) x.classList.add('ok'); else if(k===i) x.classList.add('ng'); });
    if(ok){ qsc++; buzz(10); } else buzz([20,40,20]);
    const right=q.opts.find(o=>o.ok).t;
    if(TTS.ok && /[぀-ヿ]/.test(right)) TTS.speak(right);
    document.getElementById('qtail').innerHTML=`<div class="qwhy"><b class="tag" style="background:${grad(u)}">${ok?'정답!':'해설'}</b><br>${jp(q.w)}</div>
      <div class="qnextrow"><button class="qnext press" style="background:${grad(u)}" id="qN">${qi+1>=qs.length?'결과 보기':'다음 문제 ›'}</button></div>`;
    document.getElementById('qN').onclick=()=>{ qi++; renderQ(u); };
  });
}

/* ───────── 단어장 ───────── */
function vocabView(){
  if(S.vu!=='all' && !metaOf(S.vu)) S.vu='all';
  const us = S.vu==='all' ? UNITS : [S.vu], items=us.flatMap(unitWords);
  const acc = k => k==='all' ? 'var(--brand)' : grad(k);
  $w.innerHTML=`${topnav(`단어장 · ${items.length}개`)}
    <div class="vfilter" id="vf">${['all',...UNITS].map(k=>{ const on=S.vu===k;
      return `<button data-k="${k}" aria-pressed="${on}" style="${on?`background:${acc(k)}`:''}">${k==='all'?'전체':'UNIT 0'+k}</button>`; }).join('')}</div>
    <div class="wtools">
      <button id="hideW" aria-pressed="${S.hide}" style="${S.hide?`background:${acc(S.vu)}`:''}">${S.hide?'뜻 보이기':'뜻 가리기'}</button>
      <button class="main press" id="gCards" style="background:${acc(S.vu)}">단어 카드 ›</button>
      <button class="press" id="gMatch">짝 맞추기 ›</button></div>
    <p class="vnote">누르면 발음이 나옵니다. ‘대화’ = 추가 대화에서 나온 단어 · 점 3개 = 외운 정도.</p>
    ${us.map(u=>`<div class="vunit"><span class="n" style="background:${grad(u)}">UNIT 0${u}</span><b>${metaOf(u)[1]}</b></div>
      <div class="wgrid">${unitWords(u).map(w=>`<button class="wchip${w.x?' x':''}${S.hide?' hide':''}" data-say="${esc(w.j)}" style="--hl:${C(u)}">
        <span class="j">${w.j}</span><span class="k">${w.k}</span>${lvDots(w.j)}</button>`).join('')}</div>`).join('')}`;
  bindBack();
  $w.querySelectorAll('#vf button').forEach(b=>b.onclick=()=>{ S.vu=b.dataset.k==='all'?'all':+b.dataset.k; save(); vocabView(); });
  document.getElementById('hideW').onclick=()=>{ S.hide=!S.hide; save(); vocabView(); };
  document.getElementById('gCards').onclick=()=>go({v:'game',g:'cards',gu:S.vu});
  document.getElementById('gMatch').onclick=()=>go({v:'game',g:'match',gu:S.vu});
}

/* ───────── 게임 ───────── */
const GAMES={cards:['단어 카드','알면 오른쪽, 모르면 왼쪽으로 넘기세요'],match:['짝 맞추기','일본어와 뜻을 차례로 눌러 짝을 지으세요'],
  build:['문장 만들기','뜻을 보고 일본어 문장을 조립하세요'],listen:['듣기 퀴즈','발음을 듣고 알맞은 뜻을 고르세요']};
function gameView(){
  const g=V.g; if(V.gu==null) V.gu=S.gu;
  const gu=V.gu==='all'||!metaOf(V.gu)?'all':V.gu, col=gu==='all'?'var(--brand)':grad(gu);
  $w.innerHTML=`${topnav(GAMES[g][0])}
    <div class="vfilter" id="gf">${['all',...UNITS].map(k=>{ const on=gu===k;
      return `<button data-k="${k}" aria-pressed="${on}" style="${on?`background:${k==='all'?'var(--brand)':grad(k)}`:''}">${k==='all'?'전체':'UNIT 0'+k}</button>`; }).join('')}</div>
    <p class="vnote">${GAMES[g][1]}</p>
    <div class="qbox" id="gbox" style="--hl:${gu==='all'?'var(--c3)':C(gu)}"></div>`;
  bindBack();
  $w.querySelectorAll('#gf button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k==='all'?'all':+b.dataset.k; S.gu=k; save(); setV({gu:k}); gameView(); });
  const box=document.getElementById('gbox');
  ({cards:gCards, match:gMatch, build:gBuild, listen:gListen})[g](box, gu, null, col);
}
const resultHTML=(big,msg,col,id='gRe')=>`<div class="qfin"><div class="big" style="background:${col};-webkit-background-clip:text;background-clip:text;color:transparent">${big}</div>
  <p>${msg}</p><button class="qnext press" style="background:${col}" id="${id}">${IC.redo} 한 번 더</button></div>`;

/* 단어 카드 (라이트너 상자) */
function gCards(box,gu,_,col){
  const pool=poolOf(gu);
  const deck=shuffle(pool).sort((a,b)=>lvl(a.j)-lvl(b.j)).slice(0,Math.min(15,pool.length));
  let i=0, know=0, flip=false;
  const mastered=()=>pool.filter(w=>lvl(w.j)>=MASTER).length;
  const draw=()=>{
    if(i>=deck.length){ addXP(5); confetti();
      box.innerHTML=resultHTML(`${know} / ${deck.length}`,`알아요 ${know} · 몰라요 ${deck.length-know}<br>외운 단어 ${mastered()} / ${pool.length} · +5 XP`,col);
      document.getElementById('gRe').onclick=()=>gCards(box,gu,_,col); return; }
    const w=deck[i]; flip=false;
    box.innerHTML=`<div class="fstat"><span><b>${i+1}</b> / ${deck.length}</span><span>외운 단어 <b>${mastered()}</b> / ${pool.length}</span></div>
      <div class="fwrap"><div class="fcard" id="fc">
        <span class="fu" style="background:${grad(w.u)}">UNIT 0${w.u}</span><span class="lv">${[0,1,2].map(k=>`<i class="${lvl(w.j)>k?'on':''}"></i>`).join('')}</span>
        <span class="tagk">알아요</span><span class="tagn">몰라요</span>
        <span class="fj">${w.j}</span><span class="fk hid" id="fk">${w.k}</span><span class="fh" id="fh">카드를 누르면 뜻이 보여요</span></div></div>
      <div class="fbtns"><button class="no press" id="fNo">← 몰라요</button>${TTS.ok?`<button class="say press" id="fSay" aria-label="발음">${IC.spk}</button>`:'<span></span>'}<button class="yes press" id="fYes">알아요 →</button></div>`;
    const fc=document.getElementById('fc');
    if(TTS.ok) setTimeout(()=>TTS.speak(w.j),150);
    const reveal=()=>{ flip=true; document.getElementById('fk').classList.remove('hid'); document.getElementById('fh').textContent=''; };
    const answer=k=>{ bump('wd',1); if(k){ S.box[w.j]=Math.min(4,lvl(w.j)+1); know++; addXP(1); buzz(10); } else { S.box[w.j]=0; buzz([15,30,15]); }
      save(); fc.style.transform=`translateX(${k?130:-130}%) rotate(${k?18:-18}deg)`; fc.style.opacity='0'; i++; setTimeout(draw,260); };
    document.getElementById('fNo').onclick=()=>answer(false);
    document.getElementById('fYes').onclick=()=>answer(true);
    const fs=document.getElementById('fSay'); if(fs) fs.onclick=()=>TTS.speak(w.j);
    let x0=null, dx=0;
    fc.onpointerdown=e=>{ x0=e.clientX; dx=0; fc.classList.add('drag'); fc.setPointerCapture(e.pointerId); };
    fc.onpointermove=e=>{ if(x0==null) return; dx=e.clientX-x0; fc.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
      fc.querySelector('.tagk').style.opacity=Math.max(0,Math.min(1,dx/90)); fc.querySelector('.tagn').style.opacity=Math.max(0,Math.min(1,-dx/90)); };
    fc.onpointerup=fc.onpointercancel=()=>{ if(x0==null) return; x0=null; fc.classList.remove('drag');
      if(dx>90) return answer(true); if(dx<-90) return answer(false);
      fc.style.transform=''; fc.querySelectorAll('.tagk,.tagn').forEach(t=>t.style.opacity=0);
      if(Math.abs(dx)<8){ if(!flip) reveal(); TTS.speak(w.j); } };
  };
  draw();
}

/* 짝 맞추기 */
let mTimer=null;
function gMatch(box,gu,_,col){
  clearInterval(mTimer);
  const seenJ=new Set(), seenK=new Set();
  const pick=shuffle(poolOf(gu)).filter(w=>{ if(seenJ.has(w.j)||seenK.has(w.k)) return false; seenJ.add(w.j); seenK.add(w.k); return true; }).slice(0,6);
  const Lc=shuffle(pick.map((w,i)=>({i,t:w.j}))), Rc=shuffle(pick.map((w,i)=>({i,t:w.k})));
  let sel=null, done=0, miss=0, t0=null;
  const key='m'+gu, best=S.mbest[key];
  box.innerHTML=`<div class="mhead"><span>시간 <b id="mt">0.0</b>초</span><span>실수 <b id="mm">0</b></span><span>최고 <b>${best?best.toFixed(1)+'초':'—'}</b></span></div>
    <div class="mgrid"><div class="mcol">${Lc.map(c=>`<button class="mcard j" data-s="L" data-i="${c.i}">${c.t}</button>`).join('')}</div>
    <div class="mcol">${Rc.map(c=>`<button class="mcard" data-s="R" data-i="${c.i}">${c.t}</button>`).join('')}</div></div>`;
  box.querySelectorAll('.mcard').forEach(b=>b.onclick=()=>{
    if(!t0){ t0=performance.now(); mTimer=setInterval(()=>{ const el=document.getElementById('mt'); if(el) el.textContent=((performance.now()-t0)/1000).toFixed(1); },100); }
    if(b.dataset.s==='L' && TTS.ok) TTS.speak(pick[+b.dataset.i].j);
    if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel = sel===b?null:b; if(sel) sel.classList.add('sel'); return; }
    const a=sel; sel=null; a.classList.remove('sel');
    if(a.dataset.i===b.dataset.i){ a.classList.add('ok'); b.classList.add('ok'); done++; buzz(10);
      if(done===pick.length){ clearInterval(mTimer); const t=(performance.now()-t0)/1000, nb=!best||t<best;
        if(nb){ S.mbest[key]=t; } addXP(10); confetti();
        setTimeout(()=>{ box.innerHTML=resultHTML(`${t.toFixed(1)}초`,`실수 ${miss}번${nb?' · 새 최고 기록!':''} · +10 XP`,col);
          document.getElementById('gRe').onclick=()=>gMatch(box,gu,_,col); },450); }
    } else { miss++; document.getElementById('mm').textContent=miss; buzz([20,40,20]);
      [a,b].forEach(x=>{ x.classList.add('bad'); setTimeout(()=>x.classList.remove('bad'),420); }); }
  });
}

/* 문장 만들기 */
// 띄어쓰기와 문장부호(、。？！) 뒤에서 나눈 조각
const pieces = j => j.split(/\s+|(?<=[、。？！])/).filter(Boolean);
function buildPool(gu){
  const seen=new Set();
  return (gu==='all'?UNITS:[gu]).flatMap(u=>DLG[u].flatMap(d=>d.lines.map(l=>({u,j:l.j,k:l.k}))))
    .filter(x=>{ const n=pieces(x.j).length; if(n<3||n>8||seen.has(x.j)) return false; seen.add(x.j); return true; });
}
function gBuild(box,gu,onDone,col){
  col=col||(gu==='all'?'var(--brand)':grad(gu));
  const qs=shuffle(buildPool(gu)).slice(0,6); let qi=0, score=0;
  const draw=()=>{
    if(qi>=qs.length){ addXP(score*2); if(score===qs.length) confetti(); onDone&&onDone();
      box.innerHTML=resultHTML(`${score} / ${qs.length}`,`맞힌 문장 ${score}개 · +${score*2} XP`,col);
      document.getElementById('gRe').onclick=()=>gBuild(box,gu,onDone,col); return; }
    const q=qs[qi], parts=pieces(q.j); let order=shuffle(parts.map((t,i)=>({t,i})));
    if(order.every((o,k)=>o.i===k)) order=order.reverse();
    const ans=[];
    box.innerHTML=`<div class="qprog">${qs.map((_,i)=>`<i style="${i<qi?`background:var(--hl)`:''}"></i>`).join('')}</div>
      <div class="bprompt"><small>UNIT 0${q.u} · 이 뜻을 일본어로</small>${q.k}</div>
      <div class="bzone" id="bz"></div><div class="bbank" id="bb">${order.map((o,k)=>`<button class="bchip" data-k="${k}">${o.t}</button>`).join('')}</div>
      <div id="btail"></div>`;
    const bz=document.getElementById('bz');
    const paint=()=>{ bz.innerHTML=ans.map((k,n)=>`<button class="bchip" data-n="${n}">${order[k].t}</button>`).join('');
      box.querySelectorAll('#bb .bchip').forEach(b=>b.classList.toggle('used',ans.includes(+b.dataset.k)));
      bz.querySelectorAll('.bchip').forEach(b=>b.onclick=()=>{ if(bz.dataset.fin) return; ans.splice(+b.dataset.n,1); paint(); }); };
    box.querySelectorAll('#bb .bchip').forEach(b=>b.onclick=()=>{ if(bz.dataset.fin) return; ans.push(+b.dataset.k); paint();
      if(ans.length===parts.length){ bz.dataset.fin=1; const ok=ans.map(k=>order[k].t).join('|')===parts.join('|');
        bz.classList.add(ok?'ok':'ng'); if(ok){ score++; buzz(10);} else buzz([20,40,20]);
        if(TTS.ok) TTS.speak(q.j);
        document.getElementById('btail').innerHTML=`${ok?'':`<div class="bans">정답 <span class="j">${q.j}</span></div>`}
          <div class="qnextrow"><button class="qnext press" style="background:${col}" id="bN">${qi+1>=qs.length?'결과 보기':'다음 ›'}</button></div>`;
        document.getElementById('bN').onclick=()=>{ qi++; draw(); }; } });
    paint();
  };
  draw();
}

/* 듣기 퀴즈 */
function gListen(box,gu,_,col){
  if(!TTS.ok){ box.innerHTML=`<div class="qfin"><p>이 브라우저는 일본어 음성 합성을 지원하지 않습니다.<br>Safari(iPhone) 또는 Chrome에서 열어 주세요.</p></div>`; return; }
  const pool=poolOf(gu), byK={}; pool.forEach(w=>{ byK[w.k]=byK[w.k]||w; });
  const uniq=Object.values(byK), qs=shuffle(uniq).slice(0,Math.min(8,uniq.length)); let qi=0, score=0;
  const draw=()=>{
    if(qi>=qs.length){ addXP(score); if(score===qs.length) confetti();
      box.innerHTML=resultHTML(`${score} / ${qs.length}`,`+${score} XP`,col); document.getElementById('gRe').onclick=()=>gListen(box,gu,_,col); return; }
    const w=qs[qi], opts=shuffle([w,...shuffle(uniq.filter(x=>x.k!==w.k)).slice(0,3)]);
    box.innerHTML=`<div class="qprog">${qs.map((_,i)=>`<i style="${i<qi?`background:var(--hl)`:''}"></i>`).join('')}</div>
      <button class="lplay press" id="lp" style="background:${col}" aria-label="다시 듣기">${IC.spk}</button>
      <div class="lhint">눌러서 다시 듣기</div><div class="lword" id="lw"></div>
      <div class="qopts">${opts.map((o,i)=>`<button class="qopt ko" data-i="${i}">${o.k}</button>`).join('')}</div>
      <div class="qnextrow" id="ln" hidden><button class="qnext press" style="background:${col}" id="lN">${qi+1>=qs.length?'결과 보기':'다음 ›'}</button></div>`;
    const lp=document.getElementById('lp');
    const play=()=>{ lp.classList.add('speaking'); TTS.speak(w.j,()=>lp.classList.remove('speaking')); };
    lp.onclick=play; setTimeout(play,200);
    box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{ const ok=opts[+b.dataset.i]===w;
      box.querySelectorAll('.qopt').forEach((x,k)=>{ x.disabled=true; if(opts[k]===w) x.classList.add('ok'); else if(x===b) x.classList.add('ng'); });
      if(ok){ score++; buzz(10);} else buzz([20,40,20]);
      document.getElementById('lw').textContent=w.j; document.getElementById('ln').hidden=false;
      document.getElementById('lN').onclick=()=>{ qi++; draw(); }; });
  };
  draw();
}

history.replaceState(V,'');
render();
</script>
