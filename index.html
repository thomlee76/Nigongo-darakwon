:root[data-theme="dark"]{

lass=\"jp\">「は</span> ~<span class=\"jp\">です」</span>로 말합니다. 요일은 전부 「~<span class=\"jp\">ようび」</span>로 끝납니다.", "ex": [[[["きょうは なんようびですか。", null]], "오늘은 무슨 요일입니까?"], [[["テストは あさって、きんようびからです。", null]], "시험은 모레, 금요일부터입니다."], [[["これは らいねんの カレンダーです。", null]], "이것은 내년 달력입니다."]], "note": "날: <span class=\"jp\">おととい</span>(그저께) · <span class=\"jp\">きのう</span> · <span class=\"jp\">きょう</span> · <span class=\"jp\">あした</span> · <span class=\"jp\">あさって</span>(모레) / 해: <span class=\"jp\">きょねん</span> · <span class=\"jp\">ことし</span> · <span class=\"jp\">らいねん</span>"}, {"u": 3, "t": [["いま、はちじ はんです。", null]], "sub": "지금 8시 반입니다", "desc": "시각은 「~<span class=\"jp\">じ」</span>, 분은 「~<span class=\"jp\">ふん</span>/~<span class=\"jp\">ぷん」</span>, 30분은 <span class=\"jp\">「はん」</span>입니다.", "ex": [[[["いま、なんじですか。", null]], "지금 몇 시입니까?"], [[["いま、くじ はんです。", null]], "지금 9시 반입니다."], [[["かいぎは ごぜん じゅうじからです。", null]], "회의는 오전 10시부터입니다."]], "note": "<b>시각의 예외 3개</b>: 4시 <span class=\"jp\">よじ</span> · 7시 <span class=\"jp\">しちじ</span> · 9시 <span class=\"jp\">くじ</span>. (<span class=\"jp\">よんじ</span>·<span class=\"jp\">ななじ</span>·<span class=\"jp\">きゅうじ</span> ✕)"}, {"u": 3, "t": [["Aは Bでした。", null]], "sub": "A는 B였습니다", "desc": "명사의 과거 긍정입니다. <span class=\"jp\">「です」</span>를 <span class=\"jp\">「でした」</span>로 바꾸기만 하면 됩니다.", "ex": [[[["きのうは やすみでした。", null]], "어제는 쉬는 날이었습니다."], [[["きのうの かいぎは じゅうじでした。", null]], "어제 회의는 10시였습니다."], [[["きのうは なんようびでしたか。", null]], "어제는 무슨 요일이었습니까?"]], "note": "<span class=\"jp\">「いま</span>·<span class=\"jp\">げんざい</span> → <span class=\"jp\">です」</span> / <span class=\"jp\">「きのう</span>·<span class=\"jp\">むかし</span> → <span class=\"jp\">でした」</span>"}, {"u": 3, "t": [["Aは Bじゃ ありませんでした。", null]], "sub": "A는 B가 아니었습니다", "desc": "명사의 과거 부정입니다. <span class=\"jp\">「じゃ</span> <span class=\"jp\">ありません」</span>에 <span class=\"jp\">「でした」</span>를 붙입니다.", "ex": [[[["きのうは やすみじゃ ありませんでした。", null]], "어제는 쉬는 날이 아니었습니다."], [[["きのうは あめじゃ ありませんでした。", null]], "어제는 비가 아니었습니다."], [[["わたしは せんせいでは ありませんでした。", null]], "저는 선생님이 아니었습니다."]], "note": "4형태 세트로 외우세요 — <span class=\"jp\">です</span> / <span class=\"jp\">でした</span> / <span class=\"jp\">じゃ</span> <span class=\"jp\">ありません</span> / <span class=\"jp\">じゃ</span> <span class=\"jp\">ありませんでした</span>"}, {"u": 4, "t": [["~いです。/ ~いですね。", null]], "sub": "~합니다 / ~하네요", "desc": "<span class=\"jp\">い</span>형용사는 그대로 <span class=\"jp\">「です」</span>를 붙입니다. <span class=\"jp\">「ね」</span>를 붙이면 공감·확인이 됩니다.", "ex": [[[["この パンは おいしいです。", null]], "이 빵은 맛있습니다."], [[["きょうは とても あついですね。", null]], "오늘은 매우 덥네요."], [[["この もんだい、むずかしいですね。", null]], "이 문제 어렵네요."]], "note": "<span class=\"jp\">い</span>형용사에 <span class=\"jp\">「な」</span>를 넣지 않습니다. <span class=\"jp\">「あついな</span> <span class=\"jp\">ひ」</span>(✕) / <span class=\"jp\">「あつい</span> <span class=\"jp\">ひ」</span>(○)"}, {"u": 4, "t": [["~くて", null]], "sub": "~하고 (い형용사 연결)", "desc": "마지막 <span class=\"jp\">「い」</span>를 떼고 <span class=\"jp\">「くて」</span>를 붙여 여러 성질을 연결합니다. <b>앞에는 <span class=\"jp\">い</span>형용사만 올 수 있습니다.</b>", "ex": [[[["この ケーキは やすくて おいしいです。", null]], "이 케이크는 싸고 맛있습니다."], [[["この ざるそばは つめたくて おいしいですね。", null]], "이 자루소바는 차갑고 맛있네요."], [[["なつは あつくて、ふゆは さむいです。", null]], "여름은 덥고, 겨울은 춥습니다."]], "note": "예외 <b><span class=\"jp\">いい</span> → <span class=\"jp\">よくて</span></b> (<span class=\"jp\">いくて</span> ✕). <span class=\"jp\">な</span>형용사는 「~<span class=\"jp\">で」</span>를 씁니다."}, {"u": 4, "t": [["~く ありません / ~く ないです", null]], "sub": "~하지 않습니다", "desc": "<span class=\"jp\">い</span>형용사의 부정입니다. 「~<span class=\"jp\">く</span> <span class=\"jp\">ありません」</span>이 정중하고, 「~<span class=\"jp\">く</span> <span class=\"jp\">ないです」</span>가 조금 더 부드럽습니다.", "ex": [[[["きょうは あつく ありませんね。", null]], "오늘은 덥지 않네요."], [[["あの メロンは あまく ないです。", null]], "저 멜론은 달지 않습니다."], [[["すしは やすく ありません。", null]], "초밥은 싸지 않습니다."]], "note": "예외 <b><span class=\"jp\">いい</span> → <span class=\"jp\">よく</span> <span class=\"jp\">ありません</span></b> (<span class=\"jp\">いくありません</span> ✕). <span class=\"jp\">「あまいくありません」</span>(✕) — <span class=\"jp\">い</span>를 반드시 뗍니다."}, {"u": 4, "t": [["い형용사 + 명사", null]], "sub": "~한 ~", "desc": "<span class=\"jp\">い</span>형용사는 아무것도 붙이지 않고 명사 앞에 그대로 놓습니다.", "ex": [[[["むしあつい ひです。", null]], "무더운 날입니다."], [[["あたらしい くるまです。", null]], "새 차입니다."], [[["やさしい ", null], ["人", "ひと"], ["です。", null]], "상냥한 사람입니다."]], "note": "자주 쓰는 <span class=\"jp\">い</span>형용사: <span class=\"jp\">あつい</span>·<span class=\"jp\">さむい</span>·<span class=\"jp\">おいしい</span>·<span class=\"jp\">たかい</span>·<span class=\"jp\">やすい</span>·<span class=\"jp\">ながい</span>·<span class=\"jp\">みじかい</span>·<span class=\"jp\">おおきい</span>·<span class=\"jp\">ちいさい</span>·<span class=\"jp\">たのしい</span>·<span class=\"jp\">むずかしい</span>"}, {"u": 5, "t": [["な형용사 + な + 명사", null]], "sub": "~한 ~", "desc": "<span class=\"jp\">な</span>형용사는 명사 앞에서 <b><span class=\"jp\">「な」</span>를 붙입니다.</b> 명사 뒤에서는 그냥 <span class=\"jp\">「です」</span>.", "ex": [[[["まじめな ", null], ["人", "ひと"], ["です。", null]], "성실한 사람입니다."], [[["この ", null], ["部屋", "へや"], ["は しずかです。", null]], "이 방은 조용합니다."], [[["すてきな ともだちですね。", null]], "멋진 친구네요."]], "note": "<b>함정</b>: <span class=\"jp\">きれい</span> · <span class=\"jp\">ゆうめい</span> · <span class=\"jp\">きらい</span>는 <span class=\"jp\">い</span>로 끝나지만 <b><span class=\"jp\">な</span>형용사</b>입니다. <span class=\"jp\">きれいな</span> <span class=\"jp\"><ruby>花<rt>はな</rt></ruby></span>(○)"}, {"u": 5, "t": [["~で", null]], "sub": "~하고 (な형용사 연결)", "desc": "<span class=\"jp\">な</span>형용사·명사를 연결할 때는 <span class=\"jp\">「で」</span>를 씁니다. <span class=\"jp\">い</span>형용사의 <span class=\"jp\">「くて」</span>에 대응합니다.", "ex": [[[["かれは ハンサムで、やさしくて、まじめです。", null]], "그는 잘생기고 상냥하고 성실합니다."], [[["この ホテルは きれいで、しずかで、べんりです。", null]], "이 호텔은 깨끗하고 조용하고 편리합니다."], [[["うみは きれいで、たのしいです。", null]], "바다는 깨끗하고 즐겁습니다."]], "note": "<span class=\"jp\">きれいくて</span> (✕) / <span class=\"jp\">きれいで</span> (○) — <span class=\"jp\">な</span>형용사는 절대 <span class=\"jp\">「くて」</span>를 쓰지 않습니다."}, {"u": 5, "t": [["~じゃ ありません / あまり ~ない", null]], "sub": "~하지 않습니다 / 그다지 ~않습니다", "desc": "<span class=\"jp\">な</span>형용사·명사의 부정입니다. <span class=\"jp\">「あまり」</span>를 앞에 붙이면 「그다지 ~않다」가 됩니다.", "ex": [[[["あまり まじめじゃ ありません。", null]], "그다지 성실하지 않습니다."], [[["この ", null], ["店", "みせ"], ["は べんりでは ありません。", null]], "이 가게는 편리하지 않습니다."], [[["きょうは あまり いそがしく ありません。", null]], "오늘은 그다지 바쁘지 않습니다."]], "note": "<span class=\"jp\">「あまり」</span>는 <b>반드시 부정과 함께</b> 씁니다. <span class=\"jp\">「あまり</span> <span class=\"jp\">いいです」</span>(✕)"}, {"u": 5, "t": [["~が すきです / じょうずです", null]], "sub": "~를 좋아합니다 / 잘합니다", "desc": "좋아함·능숙함의 대상에는 <b><span class=\"jp\">「を」</span>가 아니라 <span class=\"jp\">「が」</span></b>를 씁니다.", "ex": [[[["かれは おんがくが すきです。", null]], "그는 음악을 좋아합니다."], [[["ケンさんは テニスが じょうずです。", null]], "켄 씨는 테니스를 잘합니다."], [[["日本語", "にほんご"], ["が ", null], ["上手", "じょうず"], ["ですね。", null]], "일본어를 잘하시네요."]], "note": "<span class=\"jp\">「音楽を</span> <span class=\"jp\">すきです」</span>(✕). 같은 부류: <span class=\"jp\">わかる</span> · <span class=\"jp\">できる</span> · <span class=\"jp\">ほしい</span>도 <span class=\"jp\">「が」</span>를 씁니다."}, {"u": 6, "t": [["ここ・そこ・あそこ・どこ", null]], "sub": "여기·거기·저기·어디", "desc": "장소를 가리키는 말입니다. <span class=\"jp\">これ</span> 계열과 같은 거리 감각입니다.", "ex": [[[["ふくやは ここですね。", null]], "옷가게는 여기네요."], [[["トイレは どこですか。", null]], "화장실은 어디입니까?"], [[["あそこに えきが あります。", null]], "저기에 역이 있습니다."]], "note": "정중하게는 <b><span class=\"jp\">こちら</span>·<span class=\"jp\">そちら</span>·<span class=\"jp\">あちら</span>·<span class=\"jp\">どちら</span></b>를 씁니다. 비즈니스에서는 <span class=\"jp\">どちら</span>가 안전합니다."}, {"u": 6, "t": [["~に あります / ありません", null]], "sub": "~에 있습니다 / 없습니다", "desc": "사물의 존재를 말합니다. 존재하는 장소에는 <b><span class=\"jp\">「に」</span></b>를 씁니다.", "ex": [[[["ベージュは ここに あります。", null]], "베이지색은 여기 있습니다."], [[["デパートは あそこに あります。", null]], "백화점은 저기에 있습니다."], [[["きいろは ありますか。", null]], "노란색은 있습니까?"]], "note": "사물·식물은 <b><span class=\"jp\">あります</span></b>, 사람·동물은 <b><span class=\"jp\">います</span></b>. 가게에서는 정중형 <b><span class=\"jp\">「ございます」</span></b>를 씁니다."}, {"u": 6, "t": [["~を ください。", null]], "sub": "~를 주세요", "desc": "물건을 요청하는 기본 표현입니다. 목적어에는 const Q = [{"u": 1, "q": "「저는 회사원입니다」를 일본어로?", "o": ["わたしは かいしゃいんです。", "わたしが かいしゃいんです。", "わたしは かいしゃいんが。"], "w": "자기소개는 「が」가 아니라 「は」를 씁니다."}, {"u": 1, "q": "「ミンさんは がくせいですか。」의 부정 대답은?", "o": ["いいえ、がくせいじゃ ありません。", "いいえ、がくせいく ありません。", "いいえ、がくせいでした。"], "w": "명사의 부정은 「じゃ ありません」입니다. 「く ありません」은 い형용사용입니다."}, {"u": 1, "q": "거래처에 자기 회사 부장을 소개할 때 맞는 것은?", "o": ["こちらは 部長の 田中です。", "こちらは 田中部長さんです。", "あれは 田中さんです。"], "w": "자기 회사 사람은 さん을 붙이지 않습니다. 또 사람에게 「あれ」는 무례합니다."}, {"u": 2, "q": "(  )に かばんは わたしのです。 — 빈칸에 맞는 것은?", "o": ["この", "これ", "ここ"], "w": "뒤에 명사 「かばん」이 있으므로 「この」입니다. 「これ」는 단독으로만 씁니다."}, {"u": 2, "q": "「それは なんですか」에서 それ가 가리키는 것은?", "o": ["상대 쪽에 있는 것", "내 쪽에 있는 것", "둘 다에게서 먼 것"], "w": "これ=내 쪽 / それ=상대 쪽 / あれ=둘 다에게서 먼 것."}, {"u": 2, "q": "「그 스마트폰은 제 것입니다」를 일본어로?", "o": ["その スマホは わたしのです。", "その スマホは わたしです。", "これ スマホは わたしのです。"], "w": "명사를 생략하고 소유만 말할 때는 「~のです」입니다."}, {"u": 2, "q": "사람을 가리킬 때 쓸 수 없는 것은?", "o": ["あれ", "あの方", "この人"], "w": "사람에게 これ·それ·あれ를 쓰면 무례합니다. この人 또는 あの方를 씁니다."}, {"u": 3, "q": "「지금 9시 반입니다」를 일본어로?", "o": ["いま、くじ はんです。", "いま、きゅうじ はんです。", "いま、ここのじ はんです。"], "w": "9시는 「くじ」입니다. 4시 よじ · 7시 しちじ와 함께 예외 3개입니다."}, {"u": 3, "q": "「きのうは やすみでした」의 부정은?", "o": ["きのうは やすみじゃ ありませんでした。", "きのうは やすみじゃ ありません。", "きのうは やすみく ありませんでした。"], "w": "과거 부정은 「じゃ ありません」 + 「でした」입니다."}, {"u": 3, "q": "날짜 「1日」의 바른 읽기는?", "o": ["ついたち", "いちにち", "ひとひ"], "w": "날짜로서의 1日은 「ついたち」입니다. 「いちにち」는 「하루(기간)」라는 뜻입니다."}, {"u": 3, "q": "「4日」의 바른 읽기는?", "o": ["よっか", "ようか", "よんにち"], "w": "よっか가 4일, ようか는 8일입니다. 자주 혼동됩니다."}, {"u": 4, "q": "「この ケーキは やすい + おいしい」를 연결하면?", "o": ["やすくて おいしいです", "やすいで おいしいです", "やすくで おいしいです"], "w": "い형용사의 연결은 い를 떼고 「くて」입니다."}, {"u": 4, "q": "「오늘은 덥지 않습니다」를 일본어로?", "o": ["きょうは あつく ありません。", "きょうは あついく ありません。", "きょうは あつじゃ ありません。"], "w": "い를 떼고 「く ありません」을 붙입니다."}, {"u": 4, "q": "「いい」의 부정형은?", "o": ["よく ありません", "いく ありません", "いいじゃ ありません"], "w": "いい는 활용할 때 よ로 바뀝니다. よくない · よかった · よくて."}, {"u": 4, "q": "い형용사가 명사를 꾸밀 때 맞는 것은?", "o": ["あつい ひ", "あついな ひ", "あつくの ひ"], "w": "い형용사는 아무것도 붙이지 않고 그대로 명사 앞에 놓습니다."}, {" const $w=document.getElementById('wrap');
const C = u => `var(--c${u})`, CB = u => `var(--c${u}b)`, CS = u => `var(--c${u}s)`;
const grad = u => `linear-gradient(115deg,${C(u)},${CB(u)})`;
function ruby(segs){ return segs.map(([t,r])=>r?`<ruby>${t}<rt>${r}</rt></ruby>`:t).join(''); }
function jp(s){ return s.replace(/[、。「」～]*[぀-ヿ一-鿿々][぀-ヿ一-鿿、。「」～々]*/g,m=>`<span class="jp">${m}</span>`); }

const wchip = (w,x) => `<div class="wchip${x?' x':''}${S.hide?' hide':''}"><span class="j">${w[0]}</span><span class="k">${w[1]}</span></div>`;
function chatHTML(lines,u,html){
  return lines.map(l=>{
    const side=l[1], plain=l[0].replace(/\{.*?\}/g,'');
    const col = side==='L' ? grad(u) : `linear-gradient(115deg,var(--ink-3),var(--ink-2))`;
    return `<div class="msg ${side}">
      <div class="avatar" style="background:${col}">${plain[0]}</div>
      <div class="bubblewrap"><div class="who">${plain}</div>
      <div class="bubble"><div class="j">${html?l[2]:jp(l[2])}</div><div class="k">${l[3]}</div></div></div></div>`;
  }).join('');
}
// 대화 1 = 기존 CONV, 대화 2~4 = DX
function dialogs(u){
  const m=META.find(x=>x[0]===u), x=DX[u]||{t0:'',d:[]};
  return [{t:x.t0, img:m[5]?IMG[m[5]]:null, h:667, lines:CONV[u]||[], html:true},
    ...x.d.map((d,i)=>({t:d.t, img:`img/u${u}d${i+2}c.webp`, h:667, lines:d.lines, html:false}))];
}
// 대화에서 새로 나온 단어 (기본 단어와 중복 제외)
function dxWords(u){
  const have=new Set((W[u]||[]).map(w=>w[0])), out=[];
  for(const d of (DX[u]?.d||[])) for(const w of d.w) if(!have.has(w[0])){ have.add(w[0]); out.push(w); }
  return out;
}
const vocabCount = () => META.reduce((n,m)=>n+(W[m[0]]||[]).length+dxWords(m[0]).length,0);

  const sp={};  // 화자 색

    const name=l[0].replace(/\{.*?\}/g,'');
    if(!(name in sp)) sp[name]=spn++;
    return l;
  });

    const name=l[0], side=l[1];
    const plain=name.replace(/\{.*?\}/g,'');

    <div class="board"><h4>${b[0]}</h4><p>${b[1]}</p><div class="bwrap">${b[2]}</div></div>`).join('');

  const words=(W[u]||[]).map(w=>wchip(w)).join('');
  const xw=dxWords(u), dl=dialogs(u);

  const prev=META.find(x=>x[0]===u-1), next=META.find(x=>x[0]===u+1);

  $w.innerHTML=`

      ${dl.map((d,i)=>`<div class="dlg">

        ${d.img?`<div class="scene"><img src="${d.img}" width="1000" height="${d.h}" alt="" ${i?'loading="lazy"':''}></div>`:''}
        <div class="chat">${chatHTML(d.lines,u,d.html)}</div></div>`).join('')}</div>

    <div class="sec"><div class="shead"><span class="ji" style="background:${grad(u)}">文</span>
      <h3>문법 포인트</h3><small>${G.filter(g=>g.u===u).length}개</small></div>${gcards}</div>

    ${boards?`<div class="sec"><div class="shead"><span class="ji" style="background:${grad(u)}">表</span>
      <h3>한눈에 보는 표</h3><small>빨간 칸 = 예외·함정</small></div>${boards}</div>`:''}

    <div class="sec"><div class="shead"><span class="ji" style="background:${grad(u)}">語</span>
      <h3>단어</h3><small>${(W[u]||[]).length+xw.length}개</small></div>
      <div class="wtools"><button id="hideW" aria-pressed="${S.hide}"
        style="${S.hide?`background:${grad(u)}`:''}">${S.hide?'뜻 보이기':'뜻 가리기'}</button>
        <button id="toVocab">전체 단어장 ›</button></div>
      <div class="wsub">기본 단어 · ${(W[u]||[]).length}개</div>
      <div class="wgrid" id="wgrid">${words}</div>
      ${xw.length?`<div class="wsub">대화 속 새 단어 · ${xw.length}개</div>
      <div class="wgrid">${xw.map(w=>wchip(w,1)).join('')}</div>`:''}</div>

    <div class="sec"><div class="shead"><span class="ji" style="background:${grad(u)}">書</span>
      <h3>쓰기 연습</h3><small>손가락으로 칸 안에 직접 써 보세요</small></div>
      <div class="ptabs">
        <button data-m="k">한자 ${WR[u].k.length}자</button>
        <button data-m="w">단어 ${WR[u].w.length}개</button>
      </div>
      <div class="pchips" id="pchips"></div>
      <div class="pcard">
        <div class="pinfo" id="pinfo"></div>
        <div class="pboard" id="pboard"><div class="pcells" id="pcells"></div><canvas id="pcv"></canvas></div>
        <div class="prow">
          <button id="pClear">지우기</button>
          <button id="pGuide" aria-pressed="true">가이드 켬</button>
          <button id="pNext">다음 ›</button>
        </div>
      </div>
      <div class="rules"><b>획순 5원칙</b>
        <ol>
          <li><b>위에서 아래로</b> — <span class="jp">三</span>은 맨 윗줄부터.</li>
          <li><b>왼쪽에서 오른쪽으로</b> — <span class="jp">川</span>은 왼쪽 획부터.</li>
          <li><b>가로획 먼저, 세로획 나중</b> — <span class="jp">十</span>은 가로 → 세로.</li>
          <li><b>바깥 테두리 → 안 → 닫는 획</b> — <span class="jp">国</span>은 마지막에 아래 가로획.</li>
          <li><b>가운데 먼저, 좌우는 나중</b> — <span class="jp">小</span>은 가운데 세로획부터.</li>
        </ol></div>
    </div>

    <div class="sec"><div class="shead"><span class="ji" style="background:${grad(u)}">？</span>
      <h3>확인 퀴즈</h3><small id="qmeta"></small></div>
      <div class="qbox" id="qbox"></div></div>

    <div class="unav">
      <button id="uPrev" ${prev?'':'disabled'}><div class="lb">‹ 이전</div>
        <div class="tt2">${prev?prev[1]:'—'}</div></button>
      <button id="uNext" class="next" ${next?'':'disabled'}><div class="lb">다음 ›</div>
        <div class="tt2">${next?next[1]:'—'}</div></button>
    </div>`;

  document.getElementById('back').onclick=()=>{ home(); scrollTo(0,0); };
  document.getElementById('uPrev').onclick=()=>{ if(prev){ unit(u-1); scrollTo(0,0);} };
  document.getElementById('uNext').onclick=()=>{ if(next){ unit(u+1); scrollTo(0,0);} };
  document.getElementById('hideW').onclick=e=>{
    S.hide=!S.hide;
    e.currentTarget.setAttribute('aria-pressed',String(S.hide));
    e.currentTarget.textContent=S.hide?'뜻 보이기':'뜻 가리기';
    e.currentTarget.style.background=S.hide?grad(u):'';
    e.currentTarget.style.color=S.hide?'#fff':'';
    document.querySelectorAll('.wgrid .wchip').forEach(c=>c.classList.toggle('hide',S.hide));
  };

  document.getElementById('toVocab').onclick=()=>{ S.vu=u; vocab(); scrollTo(0,0); };
  mountWrite(u);
  startQuiz(u);
}

/* ───────── 단어장 ───────── */
let vList=[], vIdx=0, vShow=false;
function vocabItems(){
  const us = S.vu==='all' ? META.map(m=>m[0]) : [S.vu];
  return us.flatMap(u=>[...(W[u]||[]).map(w=>({w,u,x:0})), ...dxWords(u).map(w=>({w,u,x:1}))]);
}
function vocab(keep){
  S.view='vocab';
  if(S.vu!=='all' && !META.some(m=>m[0]===S.vu)) S.vu='all';
  const items=vocabItems();
  if(!keep){ vList=items; vIdx=0; vShow=false; }
  const acc = k => k==='all' ? 'linear-gradient(115deg,var(--c3),var(--c4))' : grad(k);
  const filt=['all',...META.map(m=>m[0])].map(k=>{ const on=S.vu===k;
    return `<button data-k="${k}" aria-pressed="${on}" style="${on?`background:${acc(k)}`:''}">${k==='all'?'전체':'0'+k}</button>`; }).join('');
  const card = S.vmode==='card';
  let body;
  if(card){
    const it=vList[vIdx];
    body=`<button class="fcard" id="fcard">
        <span class="fu" style="background:${grad(it.u)}">UNIT 0${it.u}${it.x?' · 대화':''}</span>
        <span class="fc">${vIdx+1} / ${vList.length}</span>
        <span class="fj">${it.w[0]}</span>
        <span class="fk${vShow?'':' hid'}">${it.w[1]}</span>
        <span class="fh">${vShow?'':'카드를 누르면 뜻이 보입니다'}</span></button>
      <div class="prow"><button id="fPrev">‹ 이전</button><button id="fShuf">섞기</button><button id="fNext">다음 ›</button></div>`;
  } else {
    const us = S.vu==='all' ? META.map(m=>m[0]) : [S.vu];
    body=us.map(u=>{ const m=META.find(x=>x[0]===u), xw=dxWords(u);
      return `<div class="vunit"><span class="n" style="background:${grad(u)}">UNIT 0${u}</span><b>${m[1]}</b></div>
        <div class="wgrid">${(W[u]||[]).map(w=>wchip(w)).join('')}${xw.map(w=>wchip(w,1)).join('')}</div>`; }).join('');
  }
  $w.innerHTML=`<div class="topnav"><button class="backb" id="back">‹</button>
      <span class="crumb">단어장 · ${items.length}개</span></div>
    <div class="vfilter" id="vf">${filt}</div>
    <div class="wtools">
      <button data-m="list" aria-pressed="${!card}" style="${!card?`background:${acc(S.vu)}`:''}">목록</button>
      <button data-m="card" aria-pressed="${card}" style="${card?`background:${acc(S.vu)}`:''}">카드</button>
      ${card?'':`<button id="hideW" aria-pressed="${S.hide}" style="${S.hide?`background:${acc(S.vu)}`:''}">${S.hide?'뜻 보이기':'뜻 가리기'}</button>`}
    </div>
    ${card?'':'<p class="vnote">오른쪽 위 ‘대화’ 표시는 추가 대화에서 나온 단어입니다.</p>'}
    ${body}`;
  document.getElementById('back').onclick=()=>{ home(); scrollTo(0,0); };
  $w.querySelectorAll('#vf button').forEach(b=>b.onclick=()=>{
    S.vu = b.dataset.k==='all' ? 'all' : +b.dataset.k; vocab(); });
  $w.querySelectorAll('.wtools [data-m]').forEach(b=>b.onclick=()=>{ S.vmode=b.dataset.m; save(); vocab(); });
  const hb=document.getElementById('hideW');
  if(hb) hb.onclick=()=>{ S.hide=!S.hide; vocab(true); };
  if(card){
    const go=d=>{ vIdx=(vIdx+d+vList.length)%vList.length; vShow=false; vocab(true); };
    document.getElementById('fcard').onclick=()=>{ vShow=!vShow; vocab(true); };
    document.getElementById('fPrev').onclick=()=>go(-1);
    document.getElementById('fNext').onclick=()=>go(1);
    document.getElementById('fShuf').onclick=()=>{ vList=shuffle(items); vIdx=0; vShow=false; vocab(true); };
  }
}

/* ───────── 쓰기 연습 ───────── */
let pMode='k', pIdx=0, pCtx=null, pDraw=false, pLast=null, pGuideOn=true;

function pList(u){ return WR[u][pMode]; }

function mountWrite(u){
  if(!(S.wmode==='k'||S.wmode==='w')) S.wmode='k';
  pMode=S.wmode; pIdx=0; pGuideOn=true;
  const tabs=$w.querySelectorAll('.ptabs button');
  tabs.forEach(b=>{
    b.setAttribute('aria-pressed', String(b.dataset.m===pMode));
    b.style.background = b.dataset.m===pMode ? grad(u) : '';
    b.style.color = b.dataset.m===pMode ? '#fff' : '';
    b.onclick=()=>{ pMode=b.dataset.m; S.wmode=pMode; pIdx=0; save(); mountWrite(u); };
  });
  const cv=document.getElementById('pcv');
  pCtx=cv.getContext('2d');
  document.getElementById('pClear').onclick=()=>pClear();
  const gb=document.getElementById('pGuide');
  gb.setAttribute('aria-pressed','true'); gb.textContent='가이드 켬';
  gb.style.background=''; gb.style.color='';
  gb.onclick=()=>{
    pGuideOn=!pGuideOn;
    gb.setAttribute('aria-pressed',String(pGuideOn));
    gb.textContent=pGuideOn?'가이드 켬':'가이드 끔';
    document.getElementById('pcells').classList.toggle('noghost',!pGuideOn);
  };
  document.getElementById('pNext').onclick=()=>{ pIdx=(pIdx+1)%pList(u).length; pRender(u); };
  bindPad(cv);
  pRender(u);
}

function pRender(u){
  const items=pList(u), it=items[pIdx];
  document.getElementById('pchips').innerHTML=items.map((x,i)=>
    `<button class="pchip${i===pIdx?' on':''}" data-i="${i}"
      style="${i===pIdx?`background:${grad(u)};color:#fff`:''}">${x.c}</button>`).join('');
  document.getElementById('pchips').querySelectorAll('.pchip').forEach(b=>
    b.onclick=()=>{ pIdx=+b.dataset.i; pRender(u); });

  document.getElementById('pinfo').innerHTML = pMode==='k'
    ? `<div class="pi1"><span class="jp big">${it.c}</span>
         <span class="pko">${it.ko}</span><span class="pst" style="color:${C(u)}">${it.s}획</span></div>
       <div class="pi2">음 <b>${it.on}</b> · 훈 <b>${it.kun}</b></div>
       <div class="pi3">${it.ex} — ${it.exko}</div>`
    : `<div class="pi1"><span class="jp big">${it.c}</span><span class="pko">${it.ko}</span></div>
       <div class="pi2">${it.c.length}자 · 한 글자씩 칸에 맞춰 쓰세요</div>`;

  const ch=[...it.c];
  const n=ch.length<=2?4:Math.min(ch.length,5);
  const cells=document.getElementById('pcells');
  cells.style.gridTemplateColumns=`repeat(${n},1fr)`;
  cells.classList.toggle('noghost',!pGuideOn);
  const box = g => `<div class="pcell"><svg viewBox="0 0 100 100" aria-hidden="true">
      <line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/>
      <line class="d" x1="0" y1="0" x2="100" y2="100"/><line class="d" x1="100" y1="0" x2="0" y2="100"/>
      ${g?`<text class="ghost" x="50" y="53" font-size="74">${g}</text>`:''}</svg></div>`;
  const total=n*2;
  let html='';
  for(let i=0;i<total;i++) html+=box(i<ch.length?ch[i]:null);
  cells.innerHTML=html;
  requestAnimationFrame(()=>{ sizePad(); });
}

function sizePad(){
  const cv=document.getElementById('pcv'); if(!cv||!pCtx) return;
  const r=cv.getBoundingClientRect(); if(!r.width) return;
  const d=Math.min(devicePixelRatio||1,3);
  cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d);
  pCtx.setTransform(d,0,0,d,0,0);
  pCtx.lineCap='round'; pCtx.lineJoin='round';
  pCtx.lineWidth=Math.max(4, r.width*0.014);
  pCtx.strokeStyle=getComputedStyle(document.body).color;
}
function pClear(){ const cv=document.getElementById('pcv'); if(cv&&pCtx) pCtx.clearRect(0,0,cv.width,cv.height); }
function bindPad(cv){
  const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
  cv.onpointerdown=e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); pDraw=true; pLast=pt(e);
    pCtx.beginPath(); pCtx.moveTo(pLast.x,pLast.y); pCtx.lineTo(pLast.x+.1,pLast.y+.1); pCtx.stroke(); };
  cv.onpointermove=e=>{ if(!pDraw) return; e.preventDefault(); const p=pt(e);
    pCtx.beginPath(); pCtx.moveTo(pLast.x,pLast.y); pCtx.lineTo(p.x,p.y); pCtx.stroke(); pLast=p; };
  ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{pDraw=false;}));
}
window.addEventListener('resize',()=>{ if(S.view==='unit') sizePad(); });

/* 퀴즈 */
function startQuiz(u){
  qs=shuffle(Q.filter(q=>q.u===u)).map(q=>({...q, opts:shuffle(q.o.map((t,i)=>({t,ok:i===0})))}));
  qi=0; qsc=0;
  document.getElementById('qmeta').textContent=`${qs.length}문항 · 최고 기록 ${S.best[u]!=null?S.best[u]+'점':'없음'}`;
  renderQ(u);
}
function renderQ(u){
  const box=document.getElementById('qbox');
  const prog=`<div class="qprog">${qs.map((_,i)=>
    `<i style="${i<qi?`background:${C(u)}`:''}"></i>`).join('')}</div>`;
  if(qi>=qs.length){
    const perfect=qsc===qs.length;
    if(S.best[u]==null||qsc>S.best[u]){ S.best[u]=qsc; save(); }
    box.innerHTML=`${prog}<div class="qfin">
      <div class="big" style="color:${C(u)}">${qsc} / ${qs.length}</div>
      <p>${perfect?'완벽합니다! 다음 단원으로 넘어가세요.':'틀린 문제의 해설을 확인하고 다시 도전해 보세요.'}</p>
      <button class="qnext" style="background:${grad(u)}" id="qRe">다시 풀기</button></div>`;
    document.getElementById('qRe').onclick=()=>startQuiz(u);
    return;
  }
  const q=qs[qi];
  box.innerHTML=`${prog}
    <div class="qq">${jp(q.q)}</div>
    <div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}">${o.t}</button>`).join('')}</div>
    <div id="qtail"></div>`;
  box.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    box.querySelectorAll('.qopt').forEach((x,k)=>{ x.disabled=true;
      if(q.opts[k].ok) x.classList.add('ok'); else if(k===i) x.classList.add('ng'); });
    if(q.opts[i].ok) qsc++;
    document.getElementById('qtail').innerHTML=
      `<div class="qwhy"><b class="tag" style="background:${grad(u)}">해설</b><br>${jp(q.w)}</div>
       <div class="qnextrow"><button class="qnext" style="background:${grad(u)}" id="qN">
         ${qi+1>=qs.length?'결과 보기':'다음 문제'}</button></div>`;
    document.getElementById('qN').onclick=()=>{ qi++; renderQ(u); };
  });
}

home();
</script>


<script>if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
